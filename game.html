const autoAllocateRemaining = (baseAttrs, law) => {
  const priority = {
    PIOUS: 'WILLPOWER', VULGAR: 'INSIGHT', ARROGANT: 'CHARISMA', TIMID: 'INSIGHT', STOIC: 'WILLPOWER', CURIOUS: 'INSIGHT', PARANOID: 'INSIGHT', FATALIST: 'WILLPOWER'
  };
  const primary = priority[law] || 'INSIGHT';
  const finalAttrs = { ...baseAttrs };
  let remaining = 4;
  while (remaining > 0 && finalAttrs[primary] < 8) {
    finalAttrs[primary]++;
    remaining--;
  }
  const keys = Object.keys(finalAttrs).filter(k => k !== primary);
  let i = 0;
  while (remaining > 0) {
    finalAttrs[keys[i % keys.length]]++;
    remaining--;
    i++;
  }
  return finalAttrs;
};

function getVariant(variantObj, key, defaultValue) {
  return variantObj[key] || defaultValue;
}

function getSpatialDescription(template, corruptionLevel) {
  if (corruptionLevel === 'highCorruption' && template.variants.spatial.aberration) {
    return template.variants.spatial.aberration;
  }
  return template.variants.spatial.default;
}

function getSymbolDescription(template, corruptionLevel) {
  if (corruptionLevel === 'highCorruption' && template.variants.symbol.highCorruption) {
    return template.variants.symbol.highCorruption;
  }
  if (corruptionLevel === 'mediumCorruption' && template.variants.symbol.mediumCorruption) {
    return template.variants.symbol.mediumCorruption;
  }
  return template.variants.symbol.default || '';
}

function getBodyState(template, persona) {
  return template.variants.bodyState[persona.toLowerCase()] || template.variants.bodyState.default;
}

function generateDynamicScene(grimoireId, victim, killer, room, gameState) {
  const template = SCENE_TEMPLATES[grimoireId];
  if (!template) return "現場一片混亂，無法辨識具體死因。";
  const victimJobId = victim?.id || victim?.jobId || JOB_NAME_TO_ID[victim?.job];

  const infectionLevel = killer?.infection >= 3 ? 'highInfection' : killer?.infection >= 1 ? 'lowInfection' : 'default';
  const corruptionLevel = gameState?.abyssLevel >= 60 ? 'highCorruption' : gameState?.abyssLevel >= 30 ? 'mediumCorruption' : 'default';

  let scene = template.baseAction || '';

  // 輔助：統一解析 variant 定義（支援字串或物件 with level/default）
  const resolveVariant = (variantDef, level) => {
    if (variantDef === undefined || variantDef === null) return '';
    if (typeof variantDef === 'string') return variantDef;
    if (level && variantDef[level] !== undefined) return variantDef[level];
    if (variantDef.default !== undefined) return variantDef.default;
    return '';
  };

  Object.keys(template.variants || {}).forEach(key => {
    const variantDef = template.variants[key];
    let value = '';

    if (key === 'height' && room?.id) {
      value = resolveVariant(variantDef, room.id) || '此處';
    } else if (key === 'spatial') {
      value = corruptionLevel === 'highCorruption' && variantDef?.aberration
        ? variantDef.aberration
        : variantDef?.default || '';
    } else if (key === 'symbol') {
      value = corruptionLevel === 'highCorruption' && variantDef?.highCorruption
        ? variantDef.highCorruption
        : corruptionLevel === 'mediumCorruption' && variantDef?.mediumCorruption
        ? variantDef.mediumCorruption
        : variantDef?.default || '';
    } else if (key === 'bodyState') {
      const personaKey = (victim?.persona || '').toLowerCase();
      value = (variantDef && (variantDef[personaKey] || variantDef.default)) || '';
    } else if (key === 'jobDetail') {
      value = resolveVariant(variantDef, victimJobId) || '';
    } else {
      // 其餘預設視為依 infectionLevel 取值的變體
      value = resolveVariant(variantDef, infectionLevel);
    }

    // 用 replace 只取第一個出現的位置（模板應針對多次出現另行處理）
    scene = scene.replace(`[${key}]`, value);
  });

  // 補充額外段落（若 template 中有）
  if (template.variants?.spatial) {
    const spatialDesc = corruptionLevel === 'highCorruption' && template.variants.spatial?.aberration
      ? template.variants.spatial.aberration
      : template.variants.spatial?.default;
    if (spatialDesc) scene += '。' + spatialDesc;
  }
  if (template.variants?.symbol) {
    const symbolDesc = corruptionLevel === 'highCorruption' && template.variants.symbol?.highCorruption
      ? template.variants.symbol.highCorruption
      : corruptionLevel === 'mediumCorruption' && template.variants.symbol?.mediumCorruption
      ? template.variants.symbol.mediumCorruption
      : template.variants.symbol?.default;
    if (symbolDesc) scene += '。' + symbolDesc;
  }
  if (template.variants?.bodyState) {
    const personaKey = (victim?.persona || '').toLowerCase();
    const bodyDesc = (template.variants.bodyState && (template.variants.bodyState[personaKey] || template.variants.bodyState.default)) || '';
    if (bodyDesc) scene += '。' + bodyDesc;
  }
  if (template.variants?.jobDetail) {
    const jobDesc = resolveVariant(template.variants.jobDetail, victimJobId);
    if (jobDesc) scene += '。' + jobDesc;
  }

  return scene;
}

function generateCopycatScene(grimoireId, killer, victim, gameState) {
  const flawSet = COPYCAT_FLAWS[grimoireId];
  if (!flawSet) return "現場一片混亂，明顯是一場拙劣的模仿。";
  const killerJobId = killer?.id || killer?.jobId || JOB_NAME_TO_ID[killer?.job];
  let scene = flawSet.baseFlaw + ' ';
  if (killer?.stress > 70) scene += flawSet.highStress + ' ';
  else scene += flawSet.lowStress + ' ';
  if (flawSet.jobFlaw && flawSet.jobFlaw[killerJobId]) scene += flawSet.jobFlaw[killerJobId] + ' ';
  if (flawSet.personalityFlaw && flawSet.personalityFlaw[killer?.persona]) scene += flawSet.personalityFlaw[killer.persona] + ' ';
  if (killer?.infection > 0 && flawSet.infectionFlaw) scene += flawSet.infectionFlaw.infected + ' ';
  return scene.trim();
}

function getToneConfig(player) {
  const law = (player && player.persona) || 'STOIC';
  const persona = (player && player.persona) || 'STOIC';
  const key = `${law}_${persona}`;
  return TONE_LIBRARY[key] || TONE_LIBRARY['STOIC_STOIC'];
}

function getSituationalModifier(gameState, player) {
  const modifiers = [];
  if (player.stress > 90) modifiers.push('（歇斯底里地）');
  else if (player.stress > 70) modifiers.push('（顫抖著）');
  if (player.infection >= 3) modifiers.push('（凝視著手臂的紋路）');
  if (gameState.justLamented) modifiers.push('剛剛那是什麼……');
  return modifiers.length ? modifiers[Math.floor(Math.random() * modifiers.length)] : null;
}

function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getPlayerBark(actionType, result, context) {
  const { player, target, room, gameState } = context || {};
  const tone = getToneConfig(player);
  const playerJobId = player?.jobId || player?.id || JOB_NAME_TO_ID[player?.job];
  const job = JOB_KEYWORDS[playerJobId] || JOB_KEYWORDS.c3;
  // select template pools by actionType + result
  const key = `${actionType}_${result}`;
  const templates = {
    'search_success': [`[TONE_PREFIX] 果然！[TONE_SUFFIX]`, `這裡有東西…[TONE_INTENSIFIER]`],
    'search_fail': [`一無所獲。[TONE_PREFIX]`, `什麼也沒有……被清理過了？`],
    'interrogate_success': [`[TONE_PREFIX] 果然如我所料。`, `你的謊言瞞不過我，[TARGET_NAME]。`],
    'interrogate_fail': [`[TONE_PREFIX] 他什麼也不肯說……`, `被敷衍了。`],
    'move_default': [`[TONE_PREFIX] [ROOM_NAME]……`, `[TONE_PREFIX] 這裡有些不對勁。`],
    'default': [`[TONE_PREFIX] 我在這裡。`, `[TONE_PREFIX] 好的。`]
  };
  const pool = templates[key] || templates.default;
  let template = pool[Math.floor(Math.random() * pool.length)];
  template = template.replace('[TONE_PREFIX]', randomFrom(tone.prefixes)).replace('[TONE_SUFFIX]', randomFrom(tone.suffixes)).replace('[TONE_INTENSIFIER]', randomFrom(tone.intensifiers));
  template = template.replace('[TARGET_NAME]', target?.name || '那個人').replace('[ROOM_NAME]', room?.name || '這裡');
  // job replacements
  template = template.replace('[JOB_TOOL]', job.tool || '').replace('[JOB_REACTION]', job.reaction || '');
  const situational = getSituationalModifier(gameState, player);
  if (situational && Math.random() > 0.5) template = `${situational} ${template}`;
  return template;
}

// ========== 羈絆系統輔助函式（輕量）
function initBonds(chars) {
  const bonds = {};
  chars.forEach(c => { bonds[c.id] = { player: 0 }; });
  return bonds;
}
function adjustBond(gameState, npcId, delta) {
  gameState.bonds = gameState.bonds || initBonds(gameState.characters || []);
  gameState.bonds[npcId] = gameState.bonds[npcId] || { player: 0 };
  gameState.bonds[npcId].player = (gameState.bonds[npcId].player || 0) + delta;
}
function getBond(gameState, npcId) {
  return (gameState.bonds && gameState.bonds[npcId] && gameState.bonds[npcId].player) || 0;
}

// 打字機效果元件 (增強懸疑感)
const TypewriterText = ({ text, speed = 30, onComplete }) => {
  const [displayedText, setDisplayedText] = useState('');
  useEffect(() => {
    setDisplayedText('');
    let i = 0;
    const interval = setInterval(() => {
      setDisplayedText(text.substring(0, i + 1));
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        if (onComplete) onComplete();
      }
    }, speed);
    return () => clearInterval(interval);
  }, [text, speed, onComplete]);
  return <span>{displayedText}</span>;
};

// NPC 日常生活日誌生成
const generateDailyLifeLogs = (chars, day) => {
  const logs = [];
  const aliveChars = chars.filter(c => c.alive);
  if (aliveChars.length === 0) return logs;
  
  // 隨機選取 3-5 個角色產生當日可見行為
  const sampledChars = aliveChars.sort(() => 0.5 - Math.random()).slice(0, Math.min(4, aliveChars.length));
  const timeOfDay = day % 3 === 0 ? 'morning' : day % 3 === 1 ? 'noon' : 'evening';
  
  sampledChars.forEach(char => {
    const routine = NPC_DAILY_ROUTINES[char.id];
    if (!routine || !routine[timeOfDay]) return;
    
    const activity = routine[timeOfDay];
    let desc = activity.desc;
    
    if (activity.targetPreference) {
      let target = null;
      if (activity.targetPreference === 'highStress') {
        target = aliveChars.filter(c => c.id !== char.id).sort((a,b) => b.stress - a.stress)[0];
      } else {
        target = aliveChars.find(c => c.id === activity.targetPreference);
      }
      if (target) {
        desc = desc.replace(/某人|船員/g, target.name);
      }
    }
    
    logs.push({
      id: generateId(),
      day: day,
      phase: '白天',
      msg: `👁️ 【目擊】${char.name} ${desc}。`,
      type: 'ambient'
    });
  });
  
  return logs;
};

// ==========
// 評估扮演法則合規性（每日結算）
// 輸入：prevState（昨日狀態）、nextState（將要生效的狀態片段）
// 輸出：{ chars, logs, attrChanges }
const evaluateRoleplayCompliance = (prevState, nextState) => {
  const logs = [];
  const actions = (prevState.dailyActions || []).filter(a => a.day === prevState.day);
  let chars = [...nextState.characters];
  const playerId = prevState.playerCard?.id;
  const playerPersona = prevState.playerCard?.persona;
  const day = nextState.day;
  const attrChanges = {};

  if (!playerId || !playerPersona) return { chars, logs, attrChanges };

  const pIdx = chars.findIndex(c => c.id === playerId);
  if (pIdx === -1) return { chars, logs, attrChanges };

  switch (playerPersona) {
    case PERSONA.PIOUS: {
      const didPray = actions.some(a => (a.type === 'visit_room' && a.room === 'chapel') || (a.type === 'interrogate' && prevState.characters.find(cc => cc.id === a.targetId)?.job === '神父'));
      if (didPray) {
        chars[pIdx].stress = Math.max(0, (chars[pIdx].stress || 0) - 5);
        logs.push({ id: generateId(), day, phase: '清晨', msg: '你在祈禱室找到了片刻平靜。法則獎勵：壓力 -5。', type: 'success' });

const performSkillCheck = (baseChance, difficulty, attributeBonus = 0, modifiers = {}, abyssMod = 0) => {
  const attrModifier = attributeBonus * 3; // 每點屬性 +3%
  const situationalMod = modifiers.situational || 0;
  const successTarget = Math.min(95, Math.max(5, baseChance + attrModifier + situationalMod - difficulty - abyssMod));
  
  const roll = Math.floor(Math.random() * 100) + 1;
  const success = roll <= successTarget;
  const isCritical = roll <= 5;
  const isFumble = roll >= 96;
  
  return {
    success,
    roll,
    target: successTarget,
    isCritical,
    isFumble,
    margin: success ? roll - successTarget : successTarget - roll,
    message: isCritical ? '⭐ 大成功！' : isFumble ? '💥 大失敗！' : success ? '✓ 成功' : '✗ 失敗'
  };
};

// 搜查檢定
const performSearchCheck = (playerInsight, roomDifficulty = 15) => {
  return performSkillCheck(40, roomDifficulty, playerInsight);
};

};

const performFearResistCheck = (playerWillpower, eventIntensity = 10) => {

  }

  }
  
  const defaultReports = [

    "🤫 船員們低聲交談，但每當你靠近，談話便戛然而止。",

// 隱藏信息層 - 支援多層次證詞深度
const generateResponse_Enhanced = (char, questionType, isAbyssalLament, allChars, playerAttributes = {}, playerKnowledge = {}, depth = 1) => {
  if (!char.alive) return "（這是一具屍體，無法回答你。）";
  const bg = NPC_BACKGROUNDS[char.id] || {};
  const suspect = allChars.find(c => c.id === char.suspectedId);

  // 表層證詞
  if (depth === 1) {
    if (questionType === 'belief') {
      if (char.possessed) return `兇手？我們都是罪人…海洋會吞噬一切…`;
      if (!char.suspectedId) return "（對方閃爍其辭）我…我不知道…";
      return `我注意到${suspect?.name || '某人'}最近很詭異…`;
    }
    // 其他普通問題回覆（保守）
    if (char.possessed) return `昨晚？黑暗在爬行…我整晚祈禱，哪裡都沒去！`;
    if (char.stress > 70) return `（聲音顫抖）魔鬼…海水在…${bg.fear || ''}`;
    if (isAbyssalLament) return `昨晚海神在${bg.fear || ''}…詛咒殺了他…`;
    return `我昨晚待在自己的艙房，沒聽到什麼異常。你最好去查查別人。`;
  }

  // 中層證詞（需要大成功或羈絆）
  if (depth === 2) {
    if (questionType === 'belief' && suspect) {
      return `我跟你說，${suspect.name}最近行為怪異，我親眼看見他${(suspect.infection || 0) > 0 ? '手臂上有奇怪的紋路' : '半夜在走廊徘徊'}。`;
    }
    return `我…我其實有看到一些東西。${char.suspectedId ? `我覺得是${suspect?.name || '那人'}，因為${bg.fear ? ('他總是讓我想到' + bg.fear) : '他的眼神不對'}.` : '但我真的不確定…'}`;
  }

  // 深層證詞（連續追問或極高信任）
  if (depth === 3) {
    return `我不知道為什麼要說這些……好像有人替我寫好了台詞。我甚至不記得昨天中午吃了什麼，但我知道我「應該」懷疑${suspect?.name || '那個人'}。這一切都不真實…`;
  }

  // fallback to legacy behaviour if depth not matched
  if (questionType === 'belief') {
    if (char.possessed) return `兇手？我們都是罪人…海洋會吞噬一切…找${char.name}有什麼意義？`;
    if (!char.suspectedId && !(playerKnowledge?.[`suspect_${char.id}`])) return "（對方閃爍其辭）我…我不知道…每個人都很可疑…";
    if (!suspect) return "我腦子很亂，不知道該懷疑誰…";
    if (char.persona === PERSONA.ARROGANT) return `這還用問？肯定是那下賤的${suspect.name}！`;
    if (char.persona === PERSONA.TIMID) return `我…我覺得是${suspect.name}…他的眼神…`;
    if (char.persona === PERSONA.PIOUS) return `願主寬恕，但魔鬼已附身在${suspect.name}身上…`;
    return `我注意到${suspect.name}最近很詭異…`;
  }

  if (char.possessed) {
    if (char.persona === PERSONA.PIOUS) return `昨晚？黑暗在爬行…我整晚祈禱，哪裡都沒去！`;
    if (char.persona === PERSONA.VULGAR) return `老子昨晚睡死了！什麼都不記得！`;
  }

  if (char.stress > 70) {
    if (char.persona === PERSONA.PIOUS || char.persona === PERSONA.TIMID) {
      return `（聲音顫抖）魔鬼…海水在…${bg.fear || ''}…下一個是我…`;
    }
    if (char.persona === PERSONA.STOIC || char.persona === PERSONA.ARROGANT) {
      return `（眼神閃爍）是那本古書殺的。怪物在殺人與宮何干？`;
    }
  }

  if (isAbyssalLament) return `昨晚海神在${bg.fear || ''}…詛咒殺了他…`;
  return `我昨晚待在自己的艙房，沒什麼特別的。你最好去查查別人。`;
};

  const avgStress = gameState.characters.filter(c => c.alive).reduce((sum, c) => sum + c.stress, 0) / gameState.characters.filter(c => c.alive).length;

  // 基礎機率 20%，隨著壓力與感染增加
  const eventChance = 0.2 + (avgStress / 200) + (totalInfection / 100);
  return Math.random() < Math.min(eventChance, 0.8); // 上限 80%
};

    }
  } else if (playerLaw === PERSONA.FATALIST) {
    // 法則：宿命論者對抗行為更困難
    clone.choices = clone.choices.map(c => ({ ...c, difficulty: (c.difficulty || 12) + 3 }));
  }

  return clone;
};

const updateNPCBeliefs = (chars, truths) => {
  const lastTruth = truths[truths.length - 1];
  if (!lastTruth) return chars;
  return chars.map(char => {
    if (!char.alive || char.possessed) return { ...char, suspectedId: null };
    let newSuspectId = char.suspectedId;
    let roll = Math.random();
    if (char.location === lastTruth.location) {
      if (roll > 0.4) {
        const killerChar = chars.find(c => c.name === lastTruth.killer);
        if (killerChar) newSuspectId = killerChar.id;
      }
    } else {
      let potentialSuspects = chars.filter(c => c.alive && c.id !== char.id);
      if (potentialSuspects.length > 0) {
        if (char.persona === PERSONA.ARROGANT) {
          const targets = potentialSuspects.filter(c => c.persona === PERSONA.VULGAR || c.job.includes('水手'));
          if (targets.length > 0) newSuspectId = targets[Math.floor(Math.random() * targets.length)].id;
        } else if (char.persona === PERSONA.TIMID) {
          newSuspectId = potentialSuspects.sort((a,b) => b.stress - a.stress)[0].id;
        } else {
          if (roll > 0.7) newSuspectId = potentialSuspects[Math.floor(Math.random() * potentialSuspects.length)].id;
        }
      }
    }
    return { ...char, suspectedId: newSuspectId };
  });
};

     return "（眼神閃爍，語氣過於鎮定）是那本古書殺的，不是嗎？每個人都知道詛咒降臨了。怪物在殺人，與我何干？";

// Web Audio 音效管理器 Hook
// ==========================================
const useGameAudio = (isGameStarted) => {
  const [audioCtx, setAudioCtx] = React.useState(null);
  const [isPlaying, setIsPlaying] = React.useState(false);
  const sourcesRef = React.useRef({ drone1: null, drone2: null, pulse: null, pulseCarrier: null, voice: null, voiceLFO: null });
  const gainNodesRef = React.useRef({});

  const initAudio = React.useCallback(() => {
    if (audioCtx) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0.36;
      masterGain.connect(ctx.destination);

      // Drone
      const drone1 = ctx.createOscillator(); drone1.type = 'sawtooth'; drone1.frequency.value = 55;
      const drone2 = ctx.createOscillator(); drone2.type = 'sawtooth'; drone2.frequency.value = 52;
      const droneGain = ctx.createGain(); droneGain.gain.value = 0.15;
      const droneFilter = ctx.createBiquadFilter(); droneFilter.type = 'lowpass'; droneFilter.frequency.value = 200;
      drone1.connect(droneFilter); drone2.connect(droneFilter); droneFilter.connect(droneGain); droneGain.connect(masterGain);

      // Pulse
      const pulse = ctx.createOscillator(); pulse.type = 'sine'; pulse.frequency.value = 0.45;
      const pulseAmp = ctx.createGain(); pulseAmp.gain.value = 80;
      const pulseCarrier = ctx.createOscillator(); pulseCarrier.type = 'triangle'; pulseCarrier.frequency.value = 40;
      const pulseGain = ctx.createGain(); pulseGain.gain.value = 0.08;
      const pulseFilter = ctx.createBiquadFilter(); pulseFilter.type = 'lowpass'; pulseFilter.frequency.value = 100;
      pulse.connect(pulseAmp); pulseAmp.connect(pulseCarrier.frequency);
      pulseCarrier.connect(pulseFilter); pulseFilter.connect(pulseGain); pulseGain.connect(masterGain);
      setInterval(() => { if (ctx.state === 'running') pulse.frequency.value = 0.3 + Math.random() * 0.5; }, 5200);

      // Distant voice
      const voice = ctx.createOscillator(); voice.type = 'sine'; voice.frequency.value = 880;
      const voiceLFO = ctx.createOscillator(); voiceLFO.type = 'sine'; voiceLFO.frequency.value = 0.08;
      const voiceLFOAmp = ctx.createGain(); voiceLFOAmp.gain.value = 40;
      const voiceGain = ctx.createGain(); voiceGain.gain.value = 0.04;
      const voiceFilter = ctx.createBiquadFilter(); voiceFilter.type = 'bandpass'; voiceFilter.frequency.value = 1000; voiceFilter.Q.value = 20;
      // simple reverb buffer
      const reverbTime = 1.8; const reverbLength = Math.floor(ctx.sampleRate * reverbTime);
      const reverbBuffer = ctx.createBuffer(2, reverbLength, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = reverbBuffer.getChannelData(ch);
        for (let i = 0; i < reverbLength; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLength, 2);
      }
      const voiceReverb = ctx.createConvolver(); voiceReverb.buffer = reverbBuffer;
      voiceLFO.connect(voiceLFOAmp); voiceLFOAmp.connect(voice.frequency);
      voice.connect(voiceFilter); voiceFilter.connect(voiceReverb); voiceReverb.connect(voiceGain); voiceGain.connect(masterGain);

      drone1.start(); drone2.start(); pulse.start(); pulseCarrier.start(); voice.start(); voiceLFO.start();

      setAudioCtx(ctx);
      sourcesRef.current = { drone1, drone2, pulse, pulseCarrier, voice, voiceLFO };
      gainNodesRef.current = { masterGain, droneGain, pulseGain, voiceGain };
    } catch (e) {
      console.warn('Audio init failed', e);
    }
  }, [audioCtx]);

  const togglePlay = React.useCallback(async () => {
    if (!audioCtx) { initAudio(); setTimeout(() => { if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); setIsPlaying(true); } }, 120); return; }
    try {
      if (audioCtx.state === 'suspended') { await audioCtx.resume(); setIsPlaying(true); }
      else if (audioCtx.state === 'running') { await audioCtx.suspend(); setIsPlaying(false); }
    } catch (e) { console.warn('togglePlay error', e); }
  }, [audioCtx, initAudio]);

  React.useEffect(() => {
    if (isGameStarted && !audioCtx) initAudio();
    if (isGameStarted && audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); setIsPlaying(true); }
  }, [isGameStarted, audioCtx, initAudio]);

  const tryAutoStart = React.useCallback(() => {
    if (!audioCtx) initAudio(); else if (audioCtx.state === 'suspended') { audioCtx.resume(); setIsPlaying(true); }
  }, [audioCtx, initAudio]);

  return { isPlaying, togglePlay, tryAutoStart };
};

        const prologue = getSelectedPrologue(gameState.prologueVariant);
        addLog(`【詛咒源頭】${prologue.text}`, 'fatal');
        simulateNightLogic(true, gameState.patientZero, gameState.patientZero.grimoire, gameState.roomClues, gameState.playerCard.id);
      }, 3000);
      return () => clearTimeout(t);
    }
  }, [gameState.phase]);

  // --- 遊戲初始化 ---
  const rollIdentity = (forcedPrologueId = null) => {
    const pZero = INITIAL_CHARACTERS[Math.floor(Math.random() * INITIAL_CHARACTERS.length)];
    const primaryGrim = Object.keys(GRIMOIRES)[Math.floor(Math.random() * Object.keys(GRIMOIRES).length)];
    const playerRole = INITIAL_CHARACTERS.filter(c => c.id !== pZero.id)[Math.floor(Math.random() * (INITIAL_CHARACTERS.length - 1))];

    // 根據選定的序幕類型調整初始感染
    const prologueVar = forcedPrologueId || gameState.prologueVariant;
    const selectedPrologue = getSelectedPrologue(prologueVar);
    let adjustedChars = JSON.parse(JSON.stringify(INITIAL_CHARACTERS));
    if (selectedPrologue.initialInfection > 0) {
      adjustedChars = adjustedChars.map(c => ({
        ...c,
        infection: c.id === pZero.id ? selectedPrologue.initialInfection : c.infection
      }));
    }

    const relatedClues = CLUE_POOL.filter(c => c.grimoire === primaryGrim);
    let initialRoomClues = {};
    LOCATIONS.forEach(loc => initialRoomClues[loc.id] = {});

    if (relatedClues[0]) {
      const room = LOCATIONS.find(l => l.id === pZero.location);
      initialRoomClues[pZero.location][room.spots[Math.floor(Math.random() * room.spots.length)].id] = { type: 'grimoire', id: relatedClues[0].id };
    }
    if (relatedClues[1]) initialRoomClues['deck']['boat'] = { type: 'grimoire', id: relatedClues[1].id };

    // 關鍵改動：取得基礎屬性（16點），不自動分配
    const baseAttrs = LAW_ATTRIBUTE_TEMPLATES[playerRole.persona] || {
      INSIGHT: 4, WILLPOWER: 4, CHARISMA: 4, VIGOR: 4
    };

    setGameState(prev => ({
      ...prev,
      day: 1,
      phase: '身分揭曉',
      prologueVariant: prologueVar,
      playerCard: { ...playerRole, rule: ROLEPLAY_RULES[playerRole.persona] },
      basePlayerAttributes: { ...baseAttrs },
      allocatedAttributes: { INSIGHT: 0, WILLPOWER: 0, CHARISMA: 0, VIGOR: 0 },
      freeAttributePoints: 4,
      playerAttributes: {},
      characters: adjustedChars,
      patientZero: { charId: pZero.id, grimoire: primaryGrim },
      roomClues: initialRoomClues
    }));
  };

  const acceptIdentity = () => {
    setGameState(prev => ({ ...prev, phase: '屬性分配' }));
  };

  const finalizeAttributes = () => {
    setGameState(prev => {
      const base = prev.basePlayerAttributes || {};
      const allocated = prev.allocatedAttributes || {};
      const finalAttrs = {};
      Object.keys(base).forEach(k => {
        finalAttrs[k] = (base[k] || 0) + (allocated[k] || 0);
      });
      return { ...prev, playerAttributes: finalAttrs, phase: '開場文本' };
    });
  };

  const getRandomUnsearchedSpot = (currentClues, searchedSpots) => {
    let available = [];
    LOCATIONS.forEach(loc => {
      loc.spots.forEach(spot => {
        if (!searchedSpots[`${loc.id}_${spot.id}`] && !currentClues[loc.id][spot.id]) available.push({ roomId: loc.id, spotId: spot.id });
      });
    });
    return available.length > 0 ? available[Math.floor(Math.random() * available.length)] : null;
  };

  // --- 夜間推演引擎 ---
  const simulateNightLogic = useCallback((isFirstNight = false, pZeroObj = null, pGrim = null, currentRoomClues = null, overridePlayerId = null) => {
    setGameState(prev => {
      let chars = [...prev.characters];
      let logsToAdd = [];
      let newTruths = [...prev.truths];
      const currentPlayerId = overridePlayerId || prev.playerCard?.id;
      
      if (!chars.find(c => c.id === currentPlayerId)?.alive) {
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '結束', msg: "【身分崩潰】你死了。深淵吞噬了你的記憶。", type: 'fatal' });
        return { ...prev, isGameOver: true, phase: '結束', logs: [...prev.logs, ...logsToAdd] };
      }
      if (chars.filter(c => c.alive).length <= 2) {
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '結束', msg: "倖存者過少，沙盒推演崩潰。真相永沉海底。", type: 'fatal' });
        return { ...prev, isGameOver: true, phase: '結束', logs: [...prev.logs, ...logsToAdd] };
      }

      let isLamentNight = (!isFirstNight && (prev.day === 2 || prev.day === 4 || prev.day === 6));
      if (isLamentNight) {
        // 使用深海悲鸣事件池
        const event = ABYSSAL_LAMENT_EVENTS[Math.floor(Math.random() * ABYSSAL_LAMENT_EVENTS.length)];
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '夜晚', msg: `【深海悲鳴】${event.desc}`, type: 'fatal' });
        
        // 應用基礎壓力和特殊效果
        chars.forEach(c => { if(c.alive) c.stress = Math.min(100, c.stress + event.stressBase); });
        if (event.specialEffect) event.specialEffect(chars);
        
        // 添加後續日誌
        logsToAdd.push({ id: generateId(), day: prev.day + 1, phase: '清晨', msg: `【異象餘波】${event.followUpLog}`, type: 'alert' });
      }

      // 檢查特殊事件觸發（海怪襲擊、船員叛亂等）
      if (!isFirstNight && checkSpecialEventTrigger(prev)) {
        let specialEvent = SPECIAL_EVENTS_POOL[Math.floor(Math.random() * SPECIAL_EVENTS_POOL.length)];
        // enrich with law-specific options based on player's law
        const playerLaw = prev.playerCard?.persona;
        specialEvent = enrichSpecialEventWithLawOptions(specialEvent, playerLaw);
        // 暫停夜間推演，顯示特殊事件對話框以供玩家選擇
        setActiveSpecialEvent(specialEvent);
        return prev; // 暫時返回狀態，不更新 phase
      }

      // 初始化羈絆資料（若尚未建立）
      if (!prev.bonds) {
        prev.bonds = initBonds(chars);
      }


      // 夜間：根據 abyssLevel 機率觸發現實崩壞事件
      const abyssLevel = prev.abyssLevel || 0;
      if (!isFirstNight && abyssLevel >= 30 && Math.random() < Math.min(0.25, abyssLevel / 200)) {
        const rb = REALITY_BREAK_EVENTS[Math.floor(Math.random() * REALITY_BREAK_EVENTS.length)];
        if (rb) {
          logsToAdd.push({ id: generateId(), day: prev.day, phase: '夜晚', msg: `【現實裂縫】${rb.desc}`, type: 'fatal' });
          chars.forEach(c => { if(c.alive) c.stress = Math.min(100, c.stress + (rb.stressBase || 10)); });
          if (rb.specialEffect) rb.specialEffect(chars, prev);
          logsToAdd.push({ id: generateId(), day: prev.day + 1, phase: '清晨', msg: `【異常餘波】${rb.followUpLog}`, type: 'alert' });
        }
      }

      chars.forEach(c => c.possessed = false);
      
      // 雙殺容錯曲線邏輯
      let killsThisNight = 1;
      let isDoubleKillTonight = false;
      if (prev.voteErrors === 1 && !isFirstNight) {
        if (Math.random() > 0.5) { killsThisNight = 2; isDoubleKillTonight = true; }
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '夜晚', msg: `【恐懼蔓延】昨晚處決了無辜者，絕望的氣氛讓船員陷入瘋狂邊緣。(壓力+15)`, type: 'alert' });
        chars.forEach(c => { if(c.alive) c.stress = Math.min(100, c.stress + 15); });
      } else if (prev.voteErrors >= 2 && !isFirstNight) {
        killsThisNight = 2; isDoubleKillTonight = true;
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '夜晚', msg: `【雙殺警告】連續處決無辜者，深淵產生了共鳴！今晚有兩名殺手！`, type: 'fatal' });
      }

      const activePatientZero = pZeroObj || prev.patientZero;
      const activeGrimoire = pGrim || activePatientZero.grimoire;
      let newRoomClues = currentRoomClues ? JSON.parse(JSON.stringify(currentRoomClues)) : JSON.parse(JSON.stringify(prev.roomClues));
      let questToSet = null;

      for (let i = 0; i < killsThisNight; i++) {
        let currentAlive = chars.filter(c => c.alive && !c.possessed);
        if (currentAlive.length < 2) break;

        let killer, isCopycat = false;
        if (isFirstNight) {
          killer = currentAlive.find(c => c.id === activePatientZero.charId) || currentAlive[0]; 
        } else {
          // 主角光環 (前兩天不被選為隨機殺手或受害者)
          let possibleKillers = currentAlive;
          if (prev.day <= 2) possibleKillers = possibleKillers.filter(c => c.id !== currentPlayerId);
          if (possibleKillers.length === 0) possibleKillers = currentAlive;

          killer = possibleKillers.sort((a, b) => (b.stress + b.infection*20 + Math.random()*10) - (a.stress + a.infection*20 + Math.random()*10))[0];
          if (killer.infection === 0 && killer.stress > 70 && (killer.persona === PERSONA.ARROGANT || killer.persona === PERSONA.STOIC)) isCopycat = true;
        }

        let potentialVictims = chars.filter(c => c.alive && c.id !== killer.id);
        if (prev.day <= 2) potentialVictims = potentialVictims.filter(c => c.id !== currentPlayerId);
        let victim = potentialVictims[Math.floor(Math.random() * potentialVictims.length)];
        let methodGrimoire = activeGrimoire; 

        if (!isCopycat) chars[chars.findIndex(c => c.id === killer.id)].possessed = true;
        chars[chars.findIndex(c => c.id === victim.id)].alive = false;

        newTruths.push({ id: generateId(), day: isFirstNight ? 1 : prev.day + 1, victim: victim.name, killer: killer.name, grimoire: methodGrimoire, location: victim.location, isCopycat });
        
        let sceneDesc = '';
        if (isCopycat) {
          sceneDesc = generateCopycatScene(methodGrimoire, killer, victim, prev);
        } else {
          const room = LOCATIONS.find(l => l.id === victim.location) || null;
          sceneDesc = generateDynamicScene(methodGrimoire, victim, killer, room, prev);
        }
        logsToAdd.push({ id: generateId(), day: isFirstNight ? 1 : prev.day, phase: '夜晚', msg: `【命案發生】在 ${LOCATIONS.find(l=>l.id===victim.location).name} 發現了 ${victim.name} 的屍體。現場：${sceneDesc}`, type: 'death' });

        // 感染加速：受害者所在房間內的存活者感染依 abyssLevel 增幅
        const infectionMultiplier = (prev.abyssLevel >= 50) ? 2 : 1;
        chars.forEach(c => { if (c.alive && c.location === victim.location) c.infection = Math.min(5, (c.infection || 0) + infectionMultiplier); });

        const targetSpot = getRandomUnsearchedSpot(newRoomClues, prev.searchedSpots);
        if (targetSpot) newRoomClues[targetSpot.roomId][targetSpot.spotId] = { type: 'journal', author: victim.name, text: generateDeadNPCJournal(victim) };

        if (!isFirstNight && !isCopycat) {
          const room = LOCATIONS.find(l => l.id === victim.location);
          const availableSpots = room.spots.filter(s => !newRoomClues[room.id][s.id]);
          if (availableSpots.length > 0) {
             const unownedClues = CLUE_POOL.filter(c => c.grimoire === methodGrimoire && !prev.inventory.grimoires.includes(c.id));
             if (unownedClues.length > 0) newRoomClues[room.id][availableSpots[0].id] = { type: 'grimoire', id: unownedClues[0].id };
          }
        }
      }
      
      if (isDoubleKillTonight) {
        chars.forEach(c => { if(c.alive) c.stress = 10; });
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '夜晚', msg: `【死寂期】經歷了連續死亡，恐懼變得麻木。全體壓力歸零。`, type: 'system' });
      } else if (!isFirstNight) {
        chars.forEach(c => { if(c.alive) c.stress = Math.min(100, c.stress + 10 + Math.floor(Math.random()*10)); });
      }

      chars = updateNPCBeliefs(chars, newTruths);
      chars.forEach(c => { if (c.alive && !isLamentNight && Math.random() > 0.5) c.location = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)].id; });

      // 添加 NPC 每日例行活動日誌（讓 NPC 活起來）
      if (!isFirstNight) {
        const dailyLogs = generateDailyLifeLogs(chars, prev.day + 1);
        logsToAdd.push(...dailyLogs);
        
        // 觸發 NPC 之間的互動事件（隨機）
        if (Math.random() < 0.4) {
          const interactionEvent = triggerNPCInteraction(chars);
          if (interactionEvent) {
            logsToAdd.push({
              id: generateId(),
              day: prev.day + 1,
              phase: '白天',
              msg: `👥 【目撃】${interactionEvent}`,
              type: 'ambient'
            });
          }
        }
      }
      
      // 高侵蝕（>=75）可能導致幻影攻擊事件（清晨）
      if (!isFirstNight && (prev.abyssLevel || 0) >= 75 && Math.random() < 0.2) {
        const aliveList = chars.filter(c => c.alive && c.id !== currentPlayerId);
        if (aliveList.length >= 2) {
          const attacker = aliveList[Math.floor(Math.random() * aliveList.length)];
          const victimExtraCandidates = aliveList.filter(c => c.id !== attacker.id);
          const victimExtra = victimExtraCandidates[Math.floor(Math.random() * victimExtraCandidates.length)];
          if (victimExtra) {
            victimExtra.stress = Math.min(100, victimExtra.stress + 40);
            logsToAdd.push({ id: generateId(), day: prev.day + 1, phase: '清晨', msg: `【幻影攻擊】${attacker.name} 突然對 ${victimExtra.name} 發動攻擊，口中大喊「我看見了！你看見了！」。${victimExtra.name} 受到驚嚇，壓力暴增。`, type: 'fatal' });
            if (Math.random() < 0.3) {
              // 受傷致死
              chars[chars.findIndex(c => c.id === victimExtra.id)].alive = false;
              logsToAdd.push({ id: generateId(), day: prev.day + 1, phase: '清晨', msg: `【死亡】${victimExtra.name} 傷重不治。`, type: 'death' });
            }
          }
        }
      }

      // 添加清晨氛圍報告
      if (!isFirstNight) {
        const morningAtmosphere = generateMorningAtmosphere(chars, newTruths, prev.day + 1, isLamentNight, prev);
        logsToAdd.push({
          id: generateId(),
          day: prev.day + 1,
          phase: '清晨',
          msg: `【船內氛圍】${morningAtmosphere}`,
          type: 'system'
        });
      }

      // 玩家角色扮演獎勵
      let newAp = 8;
      if (!isFirstNight) {
        logsToAdd.push({ id: generateId(), day: prev.day, phase: '清晨', msg: `【存活獎勵】你熬過了一個夜晚，意志力獲得恢復 (AP +1) = 9 AP。`, type: 'success' });
        newAp = 9;
      }

      const nextDay = isFirstNight ? 1 : prev.day + 1;

      if (nextDay === 1 && !tutorialFlagsRef.current.completed) {
        logsToAdd.push({
          id: generateId(),
          day: 1,
          phase: '清晨',
          msg: '【內心獨白】你深吸一口帶著腐臭味的海風。你必須活下去。首先，你應該打開地圖，前往某個房間——據說死者最後出現的地方，總會留下什麼。',
          type: 'tutorial'
        });
      }

      // 輕度異象（30%） - 僅為氛圍
      if (Math.random() < 0.3) {
        const omen = MINOR_OMEN_EVENTS[Math.floor(Math.random() * MINOR_OMEN_EVENTS.length)];
        logsToAdd.push({ id: generateId(), day: nextDay, phase: '清晨', msg: `【輕度異象】${omen}`, type: 'ambient' });
      }

      // 更新深淵侵蝕度
      const deathsThisNight = Math.max(0, newTruths.length - prev.truths.length);
      let newAbyss = (prev.abyssLevel || 0) + 2 + (deathsThisNight * 5);
      // 閾值通告
      if (newAbyss >= 25 && (prev.abyssLevel || 0) < 25) logsToAdd.push({ id: generateId(), day: nextDay, phase: '清晨', msg: '【深淵侵蝕】你開始聽見海浪聲中的韻律……那是某種語言。', type: 'alert' });
      if (newAbyss >= 50 && (prev.abyssLevel || 0) < 50) logsToAdd.push({ id: generateId(), day: nextDay, phase: '清晨', msg: '【深淵侵蝕】幻影在地圖上現形，感染速度開始加倍。', type: 'alert' });
      if (newAbyss >= 75 && (prev.abyssLevel || 0) < 75) logsToAdd.push({ id: generateId(), day: nextDay, phase: '清晨', msg: '【深淵侵蝕】現實與噩夢的界限已經模糊。船員開始無差別攻擊幻影。', type: 'fatal' });
      if (newAbyss >= 100) {
        // 直接觸發隱藏結局
        logsToAdd.push({ id: generateId(), day: nextDay, phase: '清晨', msg: '【深淵降臨】深淵的力量已達頂點。這是結局的開始……', type: 'fatal' });
      }

      // 法則合規性評估與獎懲
      const compliance = evaluateRoleplayCompliance(prev, { characters: chars, day: nextDay, playerCard: prev.playerCard });
      if (compliance && compliance.logs && compliance.logs.length) logsToAdd.push(...compliance.logs);
      if (compliance && compliance.chars) chars = compliance.chars;

      // 應用屬性變更（若有）
      let newPlayerAttributes = { ...prev.playerAttributes };
      if (compliance && compliance.attrChanges) {
        Object.keys(compliance.attrChanges).forEach(k => {
          newPlayerAttributes[k] = Math.max(1, (newPlayerAttributes[k] || 0) + compliance.attrChanges[k]);
        });
      }

      // 隨機觸發 NPC 個人請求（25% 機率）
      if (!isFirstNight && Math.random() < 0.25) {
        const aliveNPCs = chars.filter(c => c.alive && c.id !== prev.playerCard?.id);
        if (aliveNPCs.length > 0) {
          const npc = aliveNPCs[Math.floor(Math.random() * aliveNPCs.length)];
              // 生成針對該 NPC 的個人請求（簡化雛形）
              const personalQuestsCatalog = {
                // 需要找到特定物品（物品會以 item.id 形式放入 inventory.items）
                c1: { key: 'lost_watch', title: '失落的懷錶', text: '我的懷錶掉了，請幫我在貨艙找回來。', difficulty: 15, reward: { item: 'precision_watch' }, condition: 'find_item', conditionData: { itemId: 'precision_watch' } },
                // 需要使用或移動走私品（視為使用後任務完成）
                c2: { key: 'smuggled_move', title: '走私品轉移', text: '我藏了一些東西在救生艇下，幫我轉移到安全地方。', difficulty: 12, reward: { item: 'smuggled' }, condition: 'use_item', conditionData: { itemId: 'smuggled' } },
                // 需要引發一個 diversion 動作（玩家執行 dailyActions 的 type='diversion'）
                c3: { key: 'revenge_diversion', title: '階級復仇', text: '幫我引開弗朗西斯科，讓我有機會回到船長室。', difficulty: 18, reward: { trust: 3 }, condition: 'diversion', conditionData: {} },
                // 需要找到 NPC 的日誌頁（inventory.npcJournals 中包含 author）
                c4: { key: 'torn_log', title: '被撕毀的日誌', text: '有人撕掉了我的日誌的最後幾頁，幫我找回來。', difficulty: 20, reward: { trust: 3 }, condition: 'find_journal', conditionData: {} },
                // fallback
                default: { key: 'favor_small', title: '私事請求', text: npc.goal || '幫我一件小忙。', difficulty: 14, reward: { item: 'smuggled' }, condition: 'generic', conditionData: {} }
              };
              const catalog = personalQuestsCatalog[npc.id] || personalQuestsCatalog.default;
              const sampleQuestText = `${npc.name} 找你私下拜託："${catalog.text}"`;
              questToSet = { id: generateId(), npcId: npc.id, npcName: npc.name, key: catalog.key, title: catalog.title, text: sampleQuestText, reward: catalog.reward, difficulty: catalog.difficulty, accepted: false };
              logsToAdd.push({ id: generateId(), day: nextDay, phase: '白天', msg: `【個人請求】${npc.name} 主動尋求你的幫助：${catalog.title}`, type: 'alert' });
        }
      }

      // 構建下一個狀態物件，並在返回前處理個人請求完成、證詞生成與已完成任務記錄
      let nextState = {
        ...prev,
        characters: chars,
        truths: newTruths,
        roomClues: newRoomClues,
        day: nextDay,
        phase: '白天',
        ap: newAp,
        isAbyssalLament: isLamentNight,
        logs: [...prev.logs, ...logsToAdd],
        dailyActions: [], // 每日行為紀錄重置
        abyssLevel: newAbyss,
        playerAttributes: newPlayerAttributes,
        activePersonalQuest: questToSet,
        personalQuests: prev.personalQuests ? [...prev.personalQuests] : [],
        completedPersonalQuests: prev.completedPersonalQuests ? [...prev.completedPersonalQuests] : [],
        testimonies: prev.testimonies ? { ...prev.testimonies } : {}
      };

      // 若有 activePersonalQuest（UI 上顯示的請求），檢查是否已達成
      try {
        if (nextState.activePersonalQuest) {
          const apq = nextState.activePersonalQuest;
          const match = PERSONAL_QUESTS_CATALOG[apq.npcId];
          if (match && match.condition && typeof match.condition === 'function') {
            if (match.condition(nextState)) {
              // 套用任務效果
              if (match.applyReward) match.applyReward(nextState);
              nextState.completedPersonalQuests.push(match.id || apq.id);
              nextState.logs.push({ id: generateId(), day: nextState.day, phase: '白天', msg: `【個人請求完成】你完成了 ${apq.npcName} 的請求：${match.title || apq.title || apq.key}`, type: 'success' });
              nextState.activePersonalQuest = null;
            }
          }
        }
      } catch (e) { /* swallow errors */ }

      // 自動檢查 catalog 中其它可完成的 PERSONAL_QUESTS
      (nextState.personalQuests || []).forEach(q => {
        if (!nextState.completedPersonalQuests.includes(q.id)) {
          try {
            if (q.condition && typeof q.condition === 'function' && q.condition(nextState)) {
              if (q.apply) q.apply(nextState);
              nextState.completedPersonalQuests.push(q.id);
              nextState.logs.push({ id: generateId(), day: nextState.day, phase: '白天', msg: `【個人請求完成】${q.npcId} 的請求已完成：${q.id}`, type: 'success' });
            }
          } catch (e) { /* ignore */ }
        }
      });

      // 基於本夜的真相（newTruths）生成簡易證詞：有小機率出現弱/強證詞
      newTruths.forEach(t => {
        const candidate = chars.find(c => c.name === t.killer);
        if (!candidate) return;
        const cid = candidate.id;
        if (!nextState.testimonies[cid]) nextState.testimonies[cid] = 0;
        const r = Math.random();
        if (r < 0.05) nextState.testimonies[cid] = Math.max(nextState.testimonies[cid], 2);
        else if (r < 0.3) nextState.testimonies[cid] = Math.max(nextState.testimonies[cid], 1);
        if (nextState.testimonies[cid] > 0) {
          nextState.logs.push({ id: generateId(), day: nextState.day, phase: '白天', msg: `【證詞】有關 ${candidate.name} 的證詞出現（等級 ${nextState.testimonies[cid]})。`, type: 'alert' });
        }
      });

      return nextState;
    });
  }, []);

  const handleNightTransition = () => simulateNightLogic(false);

  // --- 互動系統 ---
  const handleInvestigateSpot = (spot) => {
    let rollAnim = null;
    setGameState(prev => {
      const searchKey = `${activeRoom}_${spot.id}`;
      if (prev.searchedSpots[searchKey] || prev.ap <= 0) return prev;
      if (prev.day === 1 && !tutorialFlagsRef.current.completed) markTutorial('firstSearch');
      
      // 搜查障礙事件檢查（10% 機率）
      if (Math.random() < 0.1) {
        const obstacle = SEARCH_OBSTACLE_EVENTS[Math.floor(Math.random() * SEARCH_OBSTACLE_EVENTS.length)];
        setActiveDialog({
          name: '🚧 搜查障礙',
          text: obstacle.text,
          persona: 'SYSTEM',
          isObstacle: true,
          obstacleId: obstacle.id,
          obstacleText: obstacle.fixAttempt,
          isTyping: true
        });
        addLog(`【搜查 ${spot.name}】遭遇障礙：${obstacle.text}`, 'alert');
        // 障礙也消耗 AP，但不標記為已搜查
        return { ...prev, ap: Math.max(0, prev.ap - 1) };
      }
      
      // 執行搜查檢定
      const playerInsight = prev.playerAttributes?.[PLAYER_ATTRIBUTES.INSIGHT] || 3;
      const roomDifficulty = 15; // 基礎難度
      const checkResult = performSearchCheck(playerInsight, roomDifficulty);
      rollAnim = { check: checkResult, label: `搜查：${spot.name}` };
      
      let newSearchedSpots = { ...prev.searchedSpots, [searchKey]: true };
      const clueObj = prev.roomClues[activeRoom]?.[spot.id];
      
      let logsToAdd = [];
      let newInventory = { ...prev.inventory };
      let discoveryMessage = '';
      let shouldShowPopup = false;
      
      if (clueObj && clueObj.type === 'grimoire') {
        // 發現古籍 - 關鍵發現！
        newInventory = { ...prev.inventory, grimoires: [...prev.inventory.grimoires, clueObj.id] };
        discoveryMessage = `【搜查 ${spot.name}】發現了古籍的殘頁碎片！其中記載著詭異的圖形與文字…`;
        shouldShowPopup = true;
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: discoveryMessage + ` [檢定 ${checkResult.message}]`, type: 'success' });
        const bark = getPlayerBark('search', checkResult.success ? 'success' : 'fail', { player: prev.playerCard, room: LOCATIONS.find(l=>l.id===activeRoom), gameState: prev });
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: bark, type: 'bark' });
      } else if (clueObj && clueObj.type === 'journal') {
        // 發現日記 - 關鍵發現！
        newInventory = { ...prev.inventory, npcJournals: [...prev.inventory.npcJournals, { id: generateId(), author: clueObj.author, text: clueObj.text }] };
        discoveryMessage = `【搜查 ${spot.name}】發現了一頁血跡斑斑的日記。字跡顫抖，像是出自一個絕望之人…`;
        shouldShowPopup = true;
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: discoveryMessage + ` [檢定 ${checkResult.message}]`, type: 'alert' });
        const bark = getPlayerBark('search', checkResult.success ? 'success' : 'fail', { player: prev.playerCard, room: LOCATIONS.find(l=>l.id===activeRoom), gameState: prev });
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: bark, type: 'bark' });
      } else {
        // 環境線索或無收穫
        if (checkResult.success && checkResult.isCritical) {
          discoveryMessage = `【觀察 ${spot.name}】你注意到一些細微的線索…${FIXED_ENV_HINTS[Math.floor(Math.random() * FIXED_ENV_HINTS.length)]}`;
        } else if (checkResult.success) {
          discoveryMessage = `【觀察 ${spot.name}】你仔細檢查了這裡…${FIXED_ENV_HINTS[Math.floor(Math.random() * FIXED_ENV_HINTS.length)]}`;
        } else {
          discoveryMessage = `【觀察 ${spot.name}】你沒有發現任何異常的地方。`;
        }
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: discoveryMessage + ` [檢定 ${checkResult.message}]`, type: 'normal' });
        const bark = getPlayerBark('search', checkResult.success ? 'success' : 'fail', { player: prev.playerCard, room: LOCATIONS.find(l=>l.id===activeRoom), gameState: prev });
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: bark, type: 'bark' });
      }
      
      // 顯示關鍵發現彈窗
      if (shouldShowPopup && (clueObj && (clueObj.type === 'grimoire' || clueObj.type === 'journal'))) {
        setTimeout(() => {
          setActiveDialog({
            name: '⭐ 重大發現 ⭐',
            text: clueObj.type === 'grimoire' ? 
              (CLUE_POOL.find(c => c.id === clueObj.id)?.text || discoveryMessage) :
              (`"${clueObj.text}"`),
            persona: 'DISCOVERY',
            isDiscovery: true,
            isTyping: true
          });
        }, 300);
      }
      
      return { ...prev, ap: prev.ap - 1, searchedSpots: newSearchedSpots, inventory: newInventory, logs: [...prev.logs, ...logsToAdd], dailyActions: [...(prev.dailyActions||[]), { type: 'investigate', room: activeRoom, spot: spot.id, day: prev.day }] };
    });
    if (rollAnim) triggerDiceAnimation(rollAnim.check, rollAnim.label);
  };

  // 個人請求檢定流程：呼叫時會對應 quest 的 difficulty 做檢定，並在成功/失敗時處理獎懲
  const resolvePersonalQuest = (questId, accept = true) => {
    setGameState(prev => {
      const quests = [...(prev.personalQuests || [])];
      const qIdx = quests.findIndex(q => q.id === questId || q.key === questId);
      if (qIdx === -1) return prev;
      const quest = quests[qIdx];
      let logsToAdd = [];
      if (!accept) {
        // 拒絕：NPC 信任下降、壓力上升
        const chars = prev.characters.map(c => c.id === quest.npcId ? { ...c, stress: Math.min(100, (c.stress||0) + 20) } : c);
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `【個人請求】你拒絕了 ${quest.npcName} 的請求。信任降低，對方情緒受創。`, type: 'alert' });
        quests.splice(qIdx,1);
        return { ...prev, personalQuests: quests, characters: chars, logs: [...prev.logs, ...logsToAdd] };
      }

      // 接受並執行檢定
      const playerAttrVal = prev.playerAttributes?.[PLAYER_ATTRIBUTES.INSIGHT] || prev.playerAttributes?.[PLAYER_ATTRIBUTES.VIGOR] || 3;
      const check = performSkillCheck(50, quest.difficulty || 15, playerAttrVal);
      if (check.success) {
        // 成功：給予獎勵（物品或信任）
        let newInv = { ...prev.inventory };
        if (quest.reward?.item) {
          newInv.items = [...(newInv.items||[]), { id: quest.reward.item, name: quest.reward.item, qty: 1 }];
        }
        const chars = prev.characters.map(c => c.id === quest.npcId ? { ...c, stress: Math.max(0, (c.stress||0) - 15) } : c);
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `【任務完成】你完成了 ${quest.npcName} 的請求：${quest.title}。獎勵獲得：${quest.reward?.item || '信任'}`, type: 'success' });
        quests.splice(qIdx,1);
        return { ...prev, personalQuests: quests, inventory: newInv, characters: chars, logs: [...prev.logs, ...logsToAdd] };
      } else {
        // 失敗：懲罰（NPC 壓力增加，可能影響後續）
        const chars = prev.characters.map(c => c.id === quest.npcId ? { ...c, stress: Math.min(100, (c.stress||0) + 30) } : c);
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `【任務失敗】你未能完成 ${quest.npcName} 的請求：${quest.title}。對方情緒受創。`, type: 'alert' });
        quests.splice(qIdx,1);
        return { ...prev, personalQuests: quests, characters: chars, logs: [...prev.logs, ...logsToAdd] };
      }
    });
  };

  // Auto-resolve accepted personal quests when conditions are met (inventory, bond actions, or timeout)
  useEffect(() => {
    const quests = gameState.personalQuests || [];
    if (!quests.length) return;
    quests.forEach(q => {
      if (!q.accepted) return;
      // Condition-based auto-resolve
      // 1) If quest expects an item to be found/returned
      if (q.condition === 'find_item' && q.conditionData?.itemId) {
        const hasItem = (gameState.inventory?.items || []).some(it => it.id === q.conditionData.itemId || it.name === q.conditionData.itemId);
        if (hasItem) { resolvePersonalQuest(q.id, true); return; }
      }
      // 2) If quest expects the player to use an item (e.g., relocate or hand over)
      if (q.condition === 'use_item' && q.conditionData?.itemId) {
        const used = (gameState.dailyActions || []).some(a => a.type === 'use_item' && a.itemId === q.conditionData.itemId);
        if (used) { resolvePersonalQuest(q.id, true); return; }
      }
      // 3) Diversion: check for a diversion daily action
      if (q.condition === 'diversion') {
        const diverted = (gameState.dailyActions || []).some(a => a.type === 'diversion' && a.targetId === q.npcId);
        if (diverted) { resolvePersonalQuest(q.id, true); return; }
      }
      // 4) Find NPC's journal page
      if (q.condition === 'find_journal') {
        const hasJournal = (gameState.inventory?.npcJournals || []).some(j => j.author === q.npcName);
        if (hasJournal) { resolvePersonalQuest(q.id, true); return; }
      }
      // fallback: if reward item is present, also resolve
      if (q.reward?.item) {
        const hasItem = (gameState.inventory?.items || []).some(it => it.id === q.reward.item || it.name === q.reward.item);
        if (hasItem) { resolvePersonalQuest(q.id, true); return; }
      }
      // trust-based rewards: if player performed a bond action targeting the NPC
      if (q.reward?.trust) {
        const bonded = (gameState.dailyActions || []).some(a => a.type === 'bond' && a.targetId === q.npcId);
        if (bonded) { resolvePersonalQuest(q.id, true); return; }
      }
      // expiration: if accepted but not completed after 3 days, fail
      if (q.acceptedAt != null && (gameState.day - q.acceptedAt) >= 3) {
        resolvePersonalQuest(q.id, false);
        return;
      }
    });
  }, [gameState.personalQuests, gameState.inventory, gameState.dailyActions, gameState.bonds, gameState.day]);

  const handleInterrogate = (char, type = 'alibi') => {
    if (!char.alive || gameState.ap <= 0) return;
    if (gameState.day === 1 && !tutorialFlags.completed) {
      markTutorial('firstInterrogate');
      if (type === 'belief') markTutorial('firstBelief');
    }

    // 質問障礙機率（10%）
    if (Math.random() < 0.1) {
      const obstacle = INTERROGATION_OBSTACLE_EVENTS[Math.floor(Math.random() * INTERROGATION_OBSTACLE_EVENTS.length)];
      setActiveDialog({
        name: '🚧 質問障礙',
        text: obstacle.text,
        persona: 'SYSTEM',
        isObstacle: true,
        obstacleId: obstacle.id,
        obstacleText: obstacle.recovery || obstacle.text,
        isTyping: true
      });
      addLog(`【質問障礙】${obstacle.text}`, 'alert');
      return;
    }
    
    // 執行擲骰檢定
    const playerCharisma = gameState.playerAttributes?.[PLAYER_ATTRIBUTES.CHARISMA] || 3;
    const targetStress = char.stress;
    const targetTrust = (gameState.playerCard?.relations?.find(r => r.targetId === char.id)?.trust || 0);
    
    const checkResult = performInterrogationCheck(playerCharisma, targetStress, targetTrust);
    triggerDiceAnimation(checkResult, `${type === 'belief' ? '詢問看法' : '質問行蹤'}：${char.name}`);
    
    setGameState(prev => {
      let chars = [...prev.characters];
      let idx = chars.findIndex(c => c.id === char.id);
      
      // 应用压力增长（質問會讓被質問者感到被懷疑）
      if (type !== 'belief') {
        chars[idx].stress = Math.min(100, chars[idx].stress + (checkResult.success ? 5 : 15));
      }
      
      // 更新玩家知識
      let newKnowledge = { ...prev.playerKnowledge };
      if (type === 'belief') {
        newKnowledge[`suspect_${char.id}`] = true;
      } else if (type === 'secret' && checkResult.success) {
        newKnowledge[`secret_${char.id}`] = true;
      }
      
      // 計算證詞深度（影響回應詳盡程度）
      let depth = 1;
      const bond = prev.bonds?.[char.id];
      const isBonded = bond?.bonded;
      const previousInterrogations = (prev.dailyActions || []).filter(a => a.type === 'interrogate' && a.targetId === char.id).length || 0;
      if (checkResult.isCritical || isBonded) depth = 2;
      if (previousInterrogations >= 2 && checkResult.success) depth = 3;

      // 生成回應（使用增強版，傳入 depth）
      const responseText = generateResponse_Enhanced(
        chars[idx],
        type,
        prev.isAbyssalLament,
        chars,
        prev.playerAttributes,
        newKnowledge,
        depth
      );
      
      // 生成敘事反饋
      const narrativeText = generateSkillNarrative(checkResult, 'interrogate', prev.playerCard, char, chars);
      
      // 組合完整對話文本（敘事 + 回應）
      // 注意：不要在內文再手動加入中文引號，render 端會統一加上「」包裹，避免雙重引號/排版錯亂
      const fullDialogText = narrativeText + "\n\n" + responseText;
      
      setActiveDialog({ 
        name: char.name, 
        text: fullDialogText, 
        persona: char.persona, 
        stress: chars[idx].stress, 
        possessed: chars[idx].possessed, 
        skillCheck: checkResult,
        checkDetails: `[${type === 'belief' ? '信念檢定' : '別名檢定'}] 擲骰結果: ${checkResult.roll} vs 目標 ${checkResult.target} - ${checkResult.message}`,
        isTyping: true
      });
      
      const logMsg = type === 'belief' ? 
        `【詢問】詢問 ${char.name} 對真兇的看法。[檢定 ${checkResult.message}]` : 
        `【質問】質問了 ${char.name} 的行蹤。[檢定 ${checkResult.message}]`;

      const bark = getPlayerBark('interrogate', checkResult.success ? 'success' : 'fail', { player: prev.playerCard, target: chars[idx], room: LOCATIONS.find(l=>l.id===activeRoom), gameState: prev });

      return { ...prev, ap: prev.ap - 1, characters: chars, playerKnowledge: newKnowledge, logs: [...prev.logs, { id: generateId(), day: prev.day, phase: prev.phase, msg: logMsg, type: 'normal' }, { id: generateId(), day: prev.day, phase: prev.phase, msg: bark, type: 'bark' }], dailyActions: [...(prev.dailyActions||[]), { type: 'interrogate', targetId: char.id, day: prev.day }] };
    });
  };

  const handleBond = (char) => {
    if (gameState.ap < 3) { alert('AP 不足（需要 3 AP）'); return; }
    const playerCharisma = gameState.playerAttributes?.[PLAYER_ATTRIBUTES.CHARISMA] || 3;
    const check = performSkillCheck(50, 12, playerCharisma);
    triggerDiceAnimation(check, `深入交談：${char.name}`);
    setGameState(prev => {
      const newBonds = { ...(prev.bonds || {}) };
      let chars = [...prev.characters];
      const idx = chars.findIndex(c => c.id === char.id);
      let logsToAdd = [];
      if (check.success) {
        newBonds[char.id] = { bonded: true, sinceDay: prev.day, affinity: (newBonds[char.id]?.affinity||0) + 1 };
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `【羈絆】你與 ${char.name} 建立了羈絆。信任 +1。`, type: 'success' });
      } else {
        if (idx !== -1) chars[idx].stress = Math.min(100, chars[idx].stress + 15);
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `【羈絆失敗】與 ${char.name} 的深入交談未能建立信任。`, type: 'alert' });
      }
      return { ...prev, ap: Math.max(0, prev.ap - 3), bonds: newBonds, characters: chars, logs: [...prev.logs, ...logsToAdd], dailyActions: [...(prev.dailyActions||[]), { type: 'bond', targetId: char.id, day: prev.day }] };
    });
  };

  // --- 審判階段玩家政治行動（後端實作） ---
  // 拉票：消耗 AP，對單一 NPC 進行魅力檢定，成功則記錄 lobbyRecords
  const performLobby = (voterId, candidateId) => {
    let rollAnim = null;
    setGameState(prev => {
      if (prev.ap < 2) { alert('AP 不足（需要 2 AP）'); return prev; }
      const playerCharisma = prev.playerAttributes?.[PLAYER_ATTRIBUTES.CHARISMA] || 3;
      const voter = prev.characters.find(c => c.id === voterId);
      if (!voter) return prev;
      const difficulty = 20 + Math.floor((voter.stress || 0) / 5) - (prev.playerCard?.relations?.find(r=>r.targetId===voterId)?.trust || 0);
      const check = performSkillCheck(50, difficulty, playerCharisma);
      rollAnim = { check, label: `政治拉票：${voter.name}` };
      const newLobby = { voterId, targetId: candidateId, type: 'lobby', success: check.success, day: prev.day };
      const newTrial = { ...(prev.trialPhase || { votes: {}, lobbyRecords: [] }), lobbyRecords: [...((prev.trialPhase||{}).lobbyRecords||[]), newLobby] };
      const logs = [...prev.logs, { id: generateId(), day: prev.day, phase: '黃昏', msg: `你對 ${voter.name} 進行拉票（${check.success ? '成功' : '失敗'}）`, type: check.success ? 'success' : 'alert' }];
      return { ...prev, ap: Math.max(0, prev.ap - 2), trialPhase: newTrial, logs };
    });
    if (rollAnim) triggerDiceAnimation(rollAnim.check, rollAnim.label);
  };

  // 抹黑：消耗線索與 AP，使所有 NPC 對目標嫌疑 +30
  const performSlander = (candidateId) => {
    setGameState(prev => {
      if (prev.ap < 3) { alert('AP 不足（需要 3 AP）'); return prev; }
      // 簡化：若玩家擁有任一與該 candidate 關聯的古籍碎片則可執行
      const hasClue = (prev.inventory?.grimoires || []).some(gId => CLUE_POOL.find(c=>c.id===gId && c.grimoire === candidateId));
      if (!hasClue) { alert('缺少可用的線索來抹黑目標'); return prev; }
      const newLobby = { voterId: 'ALL', targetId: candidateId, type: 'slander', applied: true, day: prev.day };
      const newTrial = { ...(prev.trialPhase || { votes: {}, lobbyRecords: [] }), lobbyRecords: [...((prev.trialPhase||{}).lobbyRecords||[]), newLobby] };
      const logs = [...prev.logs, { id: generateId(), day: prev.day, phase: '黃昏', msg: `你公開展示了對 ${candidateId} 的懷疑證據，群情激憤。`, type: 'alert' }];
      return { ...prev, ap: Math.max(0, prev.ap - 3), trialPhase: newTrial, logs };
    });
  };

  // 結盟：消耗 AP 與魅力檢定，若成功則記錄雙方約定（記錄在 lobbyRecords）
  const performAlliance = (allyId, candidateId) => {
    let rollAnim = null;
    setGameState(prev => {
      if (prev.ap < 4) { alert('AP 不足（需要 4 AP）'); return prev; }
      const playerCharisma = prev.playerAttributes?.[PLAYER_ATTRIBUTES.CHARISMA] || 3;
      const ally = prev.characters.find(c => c.id === allyId);
      if (!ally) return prev;
      const difficulty = 25 + Math.floor((ally.trust || 0) / 2);
      const check = performSkillCheck(50, difficulty, playerCharisma);
      rollAnim = { check, label: `政治結盟：${ally.name}` };
      const newLobby = { voterId: allyId, type: 'alliance', targetId: candidateId, success: check.success, day: prev.day };
      const newTrial = { ...(prev.trialPhase || { votes: {}, lobbyRecords: [] }), lobbyRecords: [...((prev.trialPhase||{}).lobbyRecords||[]), newLobby] };
      const logs = [...prev.logs, { id: generateId(), day: prev.day, phase: '黃昏', msg: `你向 ${ally.name} 提出結盟（${check.success ? '成功' : '失敗'}）`, type: check.success ? 'success' : 'alert' }];
      return { ...prev, ap: Math.max(0, prev.ap - 4), trialPhase: newTrial, logs };
    });
    if (rollAnim) triggerDiceAnimation(rollAnim.check, rollAnim.label);
  };

  // 自辯：玩家為自己減少嫌疑
  const performSelfDefend = () => {
    let rollAnim = null;
    setGameState(prev => {
      if (prev.ap < 2) { alert('AP 不足（需要 2 AP）'); return prev; }
      const playerCharisma = prev.playerAttributes?.[PLAYER_ATTRIBUTES.CHARISMA] || 3;
      const difficulty = 20 + Math.floor((prev.playerCard?.suspectedBy || 0) / 2);
      const check = performSkillCheck(50, difficulty, playerCharisma);
      rollAnim = { check, label: '政治自辯' };
      const newLobby = { voterId: 'ALL', type: 'defend', targetId: prev.playerCard?.id, success: check.success, day: prev.day };
      const newTrial = { ...(prev.trialPhase || { votes: {}, lobbyRecords: [] }), lobbyRecords: [...((prev.trialPhase||{}).lobbyRecords||[]), newLobby] };
      const logs = [...prev.logs, { id: generateId(), day: prev.day, phase: '黃昏', msg: `你試圖為自己辯護（${check.success ? '說服群眾' : '未能說服'}）`, type: check.success ? 'success' : 'alert' }];
      return { ...prev, ap: Math.max(0, prev.ap - 2), trialPhase: newTrial, logs };
    });
    if (rollAnim) triggerDiceAnimation(rollAnim.check, rollAnim.label);
  };

  const ITEM_LIBRARY = {
    holy_water: {
      apply: ({ prev, chars, targetId, logsToAdd }) => {
        if (targetId) {
          const tIdx = chars.findIndex(c => c.id === targetId);
          if (tIdx !== -1) {
            chars[tIdx].stress = Math.max(0, chars[tIdx].stress - 20);
            logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `你使用了一瓶聖水：${chars[tIdx].name} 的壓力 -20。`, type: 'success' });
          }
          return;
        }
        const pIdx = chars.findIndex(c => c.id === prev.playerCard?.id);
        if (pIdx !== -1) {
          chars[pIdx].stress = Math.max(0, chars[pIdx].stress - 20);
          logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: `你喝下聖水，感覺稍微平靜。壓力 -20。`, type: 'success' });
        }
      }
    },
    smuggled: {
      apply: ({ prev, chars, logsToAdd }) => {
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: '你展示了一件走私品，某些船員的好感上升。', type: 'success' });
        const candidates = chars.filter(c => c.alive && c.id !== prev.playerCard?.id);
        const target = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
        if (target) {
          const tIdx = chars.findIndex(c => c.id === target.id);
          chars[tIdx].stress = Math.max(0, chars[tIdx].stress - 10);
        }
      }
    },
    charm: {
      apply: ({ prev, logsToAdd, newEffects }) => {
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: '你持有護身符，感覺得到一絲保護。', type: 'success' });
        newEffects.charmShield = { turns: 3, note: '抵消一次意志檢定失敗或感染增長' };
        logsToAdd.push({ id: generateId(), day: prev.day, phase: prev.phase, msg: '護身符發出微光，你感覺被短暫保護。', type: 'success' });
      }
    }
  };

  const useItem = (itemId, targetId = null) => {
    setGameState(prev => {
      const items = (prev.inventory.items || []).map(i => ({ ...i }));
      const idx = items.findIndex(i => i.id === itemId);
      if (idx === -1) return prev;
      const item = items[idx];
      let chars = [...prev.characters];
      const logsToAdd = [];
      let newEffects = { ...(prev.playerEffects || {}) };
      const itemDef = ITEM_LIBRARY[item.id];

      if (itemDef && typeof itemDef.apply === 'function') {
        itemDef.apply({ prev, chars, targetId, logsToAdd, newEffects });
      }

      // 消耗物品
      items[idx].qty = Math.max(0, (items[idx].qty || 1) - 1);
      const remaining = items.filter(i => i.qty > 0);

      return { ...prev, inventory: { ...prev.inventory, items: remaining }, characters: chars, playerEffects: newEffects, logs: [...prev.logs, ...logsToAdd], dailyActions: [...(prev.dailyActions||[]), { type: 'use_item', itemId, targetId, day: prev.day }] };
    });
  };

  // 計算 NPC 對候選人的投票傾向分數
  function calculateVotePreference(voter, candidate, gameState, trialPhase) {
    let score = 0;
    if (voter.suspectedId === candidate.id) score += 50;
    // persona 偏好
    if (voter.persona === PERSONA.ARROGANT && candidate.persona === PERSONA.VULGAR) score += 20;
    if (voter.persona === PERSONA.VULGAR && candidate.persona === PERSONA.ARROGANT) score += 15;
    if (voter.persona === PERSONA.TIMID && candidate.stress > 70) score += 25;
    // 關係影響
    const relation = (voter.relations || []).find(r => r.targetId === candidate.id);
    if (relation) {
      if (relation.type === 'RIVAL') score += 30;
      if (relation.type === 'FEAR') score += 40;
      if (relation.type === 'FRIEND') score -= 40;
      if (relation.type === 'LOVER') score -= 100;
    }
    // 當日證據關聯
    const lastTruth = gameState.truths[gameState.truths.length - 1];
    if (lastTruth && lastTruth.killer === candidate.name) {
      if (gameState.playerKnowledge?.[`evidence_${candidate.id}`]) score += 60;
    }
    // 多層證詞影響（testimony 等級: 0-none,1-weak,2-strong）
    const testimonyLevel = (gameState.testimonies && gameState.testimonies[candidate.id]) || 0;
    if (testimonyLevel === 1) score += 20;
    if (testimonyLevel >= 2) score += 45;
    if (candidate.stress > 80) score += 15;
    if (candidate.infection >= 3) score += 20;
    // 玩家拉票記錄
    if (trialPhase?.lobbyRecords) {
      const lr = trialPhase.lobbyRecords.find(r => r.voterId === voter.id);
      if (lr) {
        if (lr.type === 'lobby' && lr.targetId === candidate.id && lr.success) score += 40;
        if (lr.type === 'lobby' && lr.targetId === 'abstain' && lr.success) score -= 100;
        if (lr.type === 'slander' && lr.targetId === candidate.id && lr.applied) score += 30;
      }
    }
    // 玩家與 NPC 間的羈絆（若玩家和候選人關係良好，其他 NPC 較不易投他一票）
    try {
      const bondWithPlayer = getBond(gameState, candidate.id) || 0;
      if (bondWithPlayer >= 5) score -= 30; // 玩家影響力使其他 NPC 容易同情或猶豫
      if (bondWithPlayer <= -5) score += 30; // 若玩家與該 NPC 關係極差，反向影響
    } catch (e) { /* ignore if no bonds present */ }
    // 不投自己
    if (voter.id === candidate.id) score = -1000;
    // 隨機擾動
    score += Math.floor(Math.random() * 20) - 10;
    return score;
  }

  // 執行審判階段，playerVote 可選（若由玩家在 UI 預先選擇）
  function runTrialPhase(prev, playerVote = null) {
    const alive = prev.characters.filter(c => c.alive);
    const votes = {}; // votes[voterId] = candidateId or 'abstain'
    const trialPhase = prev.trialPhase || { votes: {}, lobbyRecords: [] };

    // NPC 投票
    alive.forEach(voter => {
      if (voter.id === prev.playerCard?.id) return; // 玩家稍後處理
      // 建立候選人名單（排除自己）
      const candidates = alive.filter(c => c.id !== voter.id);
      let best = null; let bestScore = -Infinity;
      candidates.forEach(candidate => {
        const s = calculateVotePreference(voter, candidate, prev, trialPhase);
        if (s > bestScore) { bestScore = s; best = candidate; }
      });
      votes[voter.id] = best ? best.id : 'abstain';
    });

    // 玩家投票：若傳入 playerVote 則使用，否則從 trialPhase.votes 或棄票
    const playerId = prev.playerCard?.id;
    if (playerId) {
      votes[playerId] = playerVote || (trialPhase.votes && trialPhase.votes[playerId]) || 'abstain';
    }

    // 統計票數
    const tally = {};
    Object.values(votes).forEach(v => { if (!tally[v]) tally[v] = 0; tally[v]++; });

    // 找出最高票
    let top = null; let topCount = 0;
    Object.keys(tally).forEach(k => {
      if (k === 'abstain') return;
      if (tally[k] > topCount) { top = k; topCount = tally[k]; }
    });

    // 平手檢查
    const tied = top ? Object.keys(tally).filter(k => k !== 'abstain' && tally[k] === topCount) : [];

    let logsToAdd = [];
    let chars = [...prev.characters];
    let newVoteErrors = prev.voteErrors || 0;

    if (!top || tied.length > 1) {
      // 僵局處理：預設為棄票（無人處決），增加壓力與 voteErrors
      logsToAdd.push({ id: generateId(), day: prev.day, phase: '黃昏', msg: `【僵局】投票平手或無有效票，今日無人處決。全員壓力 +15。`, type: 'alert' });
      chars.forEach(c => { if (c.alive) c.stress = Math.min(100, c.stress + 15); });
      newVoteErrors += 1;
      return { ...prev, characters: chars, phase: '夜晚', voteErrors: newVoteErrors, logs: [...prev.logs, ...logsToAdd], trialPhase: { votes, lobbyRecords: trialPhase.lobbyRecords || [] } };
    }

    // 執行處決
    const victimId = top;
    const vIdx = chars.findIndex(c => c.id === victimId);
    if (vIdx === -1) return { ...prev }; // 安全檢查
    chars[vIdx].alive = false;
    const victim = chars[vIdx];
    // 判斷是否為真兇或模仿犯
    const lastTruth = prev.truths[prev.truths.length - 1];
    const isKiller = lastTruth && lastTruth.victim === victim.name && (!lastTruth.isCopycat);
    const isCopycat = lastTruth && lastTruth.victim === victim.name && lastTruth.isCopycat;

    if (victimId === playerId) {
      logsToAdd.push({ id: generateId(), day: prev.day, phase: '黃昏', msg: `【處決】你被全體投票處決了。推演失敗。`, type: 'fatal' });
      return { ...prev, characters: chars, isGameOver: true, phase: '結束', logs: [...prev.logs, ...logsToAdd] };
    }

    if (isKiller || isCopycat) {
      logsToAdd.push({ id: generateId(), day: prev.day, phase: '黃昏', msg: `【處決】${victim.name} 被處決。現場證據指向${isCopycat? '模仿犯' : '真兇'}。`, type: isCopycat ? 'alert' : 'success' });
      chars.forEach(c => { if (c.alive) c.stress = Math.max(0, c.stress - 20); });
      newVoteErrors = 0;
    } else {
      logsToAdd.push({ id: generateId(), day: prev.day, phase: '黃昏', msg: `【處決】無辜的 ${victim.name} 被處決。恐懼與憤怒席捲全船。`, type: 'fatal' });
      chars.forEach(c => { if (c.alive) c.stress = Math.min(100, c.stress + 20); });
      newVoteErrors += 1;
    }

    return { ...prev, characters: chars, phase: '夜晚', voteErrors: newVoteErrors, logs: [...prev.logs, ...logsToAdd], trialPhase: { votes, lobbyRecords: trialPhase.lobbyRecords || [] } };
  }

  // 當前 handleVote 入口：啟動審判流程（若從 NPC 卡片觸發，代表玩家在 UI 上將投票目標設為該角色）
  const handleVote = (char) => {
    if (gameState.phase !== '黃昏') return;
    // 將玩家選擇 (投票給 char.id) 帶入審判並立即結算（UI 互動可在未來分步替換為多階段互動）
    setGameState(prev => runTrialPhase(prev, char.id));
  };

  const handleAbstain = () => {
    setGameState(prev => ({ ...prev, phase: '夜晚', logs: [...prev.logs, { id: generateId(), day: prev.day, phase: prev.phase, msg: "【棄票】眾人面面相覷，無人遭到處決。恐懼在黑夜中繼續蔓延。", type: 'alert' }] }));
  };

  // Open trial modal: prepare preview votes and reveal order
  const openTrialModal = () => {
    // prepare preview by simulating NPC vote preferences without finalizing
    const alive = gameState.characters.filter(c => c.alive);
    const tmpVotes = {};
    const reveal = [];
    const trialPhaseDraft = gameState.trialPhase || { votes: {}, lobbyRecords: [] };
    alive.forEach(voter => {
      if (voter.id === gameState.playerCard?.id) return;
      const candidates = alive.filter(c => c.id !== voter.id);
      let best = null; let bestScore = -Infinity;
      candidates.forEach(candidate => {
        const s = calculateVotePreference(voter, candidate, gameState, trialPhaseDraft);
        if (s > bestScore) { bestScore = s; best = candidate; }
      });
      tmpVotes[voter.id] = best ? best.id : 'abstain';
      reveal.push(voter.id);
    });
    // tally
    const tally = {};
    Object.values(tmpVotes).forEach(v => { tally[v] = (tally[v]||0) + 1; });
    setTrialPreviewVotes(tally);
    setTrialRevealOrder(reveal);
    setTrialPlayerSelection(null);
    setTrialOpen(true);
  };

  // animate revealing NPC votes sequentially; on finish, allow player to finalize
  const startTrialReveal = () => {
    if (trialAnimating) return;
    setTrialAnimating(true);
    const reveal = [...trialRevealOrder];
    const runningTally = { ...(trialPreviewVotes || {}) };
    // We'll step through reveal order and update a per-voter revealedVotes map
    const revealed = {};
    let idx = 0;
    const step = () => {
      if (idx >= reveal.length) {
        setTrialAnimating(false);
        return;
      }
      const voterId = reveal[idx];
      // determine this voter's target from simulated tmp (recompute for determinism)
      const voter = gameState.characters.find(c => c.id === voterId);
      const candidates = gameState.characters.filter(c => c.alive && c.id !== voterId);
      let best = null; let bestScore = -Infinity;
      candidates.forEach(candidate => {
        const s = calculateVotePreference(voter, candidate, gameState, gameState.trialPhase || { votes: {}, lobbyRecords: [] });
        if (s > bestScore) { bestScore = s; best = candidate; }
      });
      const chosen = best ? best.id : 'abstain';
      revealed[voterId] = chosen;
      // increment visual tally
      setTrialPreviewVotes(prev => ({ ...(prev||{}), [chosen]: (prev && prev[chosen] ? prev[chosen] : 0) }));
      // small visual hook: add a log indicating reveal
      setGameState(prev => ({ ...prev, logs: [...prev.logs, { id: generateId(), day: prev.day, phase: '黃昏', msg: `【投票】${voter.name} 投票給 ${chosen === 'abstain' ? '棄票' : (gameState.characters.find(c=>c.id===chosen)?.name || chosen) }。`, type: 'normal' }] }));
      idx += 1;
      setTimeout(step, 280 + Math.floor(Math.random() * 220));
    };
    step();
  };

  // Finalize trial after player selects target or abstains
  const finalizeTrial = (playerChoice) => {
    setTrialOpen(false);
    setTrialAnimating(false);
    setTrialPreviewVotes({});
    setTrialRevealOrder([]);
    // call existing runTrialPhase which will perform full resolution and logging
    setGameState(prev => runTrialPhase(prev, playerChoice));
  };

  // --- 約束圖譜 (Visual Constraint Board) ---
  const [boardVictim, setBoardVictim] = useState('');
  const [boardGrimoire, setBoardGrimoire] = useState('');
  const [boardSuspect, setBoardSuspect] = useState('');
  const [solverResult, setSolverResult] = useState(null);

  const handleDragStart = (e, type, payload) => {
    e.dataTransfer.setData('application/json', JSON.stringify({ type, payload }));
  };

  const handleDrop = (e, targetType) => {
    e.preventDefault();
    try {
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if (data.type === targetType) {
        if (targetType === 'victim') setBoardVictim(data.payload);
        if (targetType === 'grimoire') setBoardGrimoire(data.payload);
        if (targetType === 'suspect') setBoardSuspect(data.payload);
      }
    } catch (err) {}
  };

  const runConstraintAnalysis = () => {
    if (!boardVictim || !boardGrimoire || !boardSuspect) { setSolverResult({ status: 'error', finalMsg: "請完成節點連線。" }); return; }
    const victimData = gameState.truths.find(t => t.victim === boardVictim);
    const grimData = GRIMOIRES[boardGrimoire];
    const suspectData = gameState.characters.find(c => c.name === boardSuspect);
    if (!victimData || !grimData || !suspectData) return;

    let sceneMatch = victimData.grimoire === boardGrimoire;
    let sceneDesc = sceneMatch ? (victimData.isCopycat ? "手法粗糙模仿 (Copycat)" : "完美符合法則特徵") : "不相符";
    let symptomMatch = false;
    let symptomDesc = "未檢測到對應壓力或後遺症";
    
    if (suspectData.possessed && victimData.grimoire === boardGrimoire) { symptomMatch = true; symptomDesc = `表現出異常行為：${grimData.symptom}`; } 
    else if (suspectData.stress > 70) { symptomDesc = "處於精神崩潰，無法判定"; }

    let isCorrect = victimData.killer === boardSuspect && victimData.grimoire === boardGrimoire;
    setSolverResult({
      status: isCorrect ? 'success' : 'failed',
      checks: { edge1: { label: `[現場] 與 [${grimData.name}] 吻合度`, passed: sceneMatch, desc: sceneDesc }, edge2: { label: `[${suspectData.name}] 的症狀檢定`, passed: symptomMatch, desc: symptomDesc } },
      finalMsg: isCorrect ? (victimData.isCopycat ? "⚠️ 圖譜閉合。這是一場人類的拙劣模仿！" : "✅ 約束圖譜完美閉合！真正的怪物無所遁形。") : "❌ 約束方程無解。證據鏈存在矛盾。"
    });
  };

  // Developer helper: run several night cycles in sequence to smoke-test night logic
  const runNightCycleTest = (n = 3) => {
    addLog(`系統測試：模擬 ${n} 個夜間推演開始...`, 'system');
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        simulateNightLogic(false);
        addLog(`系統測試：夜間推演 ${i + 1} 已觸發。`, 'system');
      }, i * 500);
    }
  };

  // --- Map Controls ---
  const mapRef = useRef(null);
  const handleMouseDown = (e) => { if (gameState.phase === '序幕' || gameState.phase === '身分揭曉' || gameState.phase === '屬性分配' || view !== 'EXPLORE' || activeRoom !== null) return; setIsDragging(true); setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y }); };
  const handleMouseMove = (e) => { if (!isDragging) return; setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y }); };
  const handleMouseUp = () => setIsDragging(false);
  const handleWheel = (e) => { if (gameState.phase === '序幕' || gameState.phase === '身分揭曉' || gameState.phase === '屬性分配' || view !== 'EXPLORE' || activeRoom !== null) return; e.preventDefault(); setScale(s => Math.min(Math.max(s - e.deltaY * 0.001, 0.4), 2.5)); };
  useEffect(() => { const el = mapRef.current; if (el) { el.addEventListener('wheel', handleWheel, { passive: false }); return () => el.removeEventListener('wheel', handleWheel); } }, [view, gameState.phase, activeRoom]);

  const filteredLogs = gameState.logs.filter(log => {
    if (logFilter === 'ALL') return true;
    return ['fatal', 'death', 'success', 'alert'].includes(log.type);
  });
  const tutorialTargetRoomId = gameState.truths?.[0]?.location || 'captain';
  const tutorialTargetLoc = LOCATIONS.find(l => l.id === tutorialTargetRoomId) || LOCATIONS.find(l => l.id === 'captain');
  const tutorialActive = gameState.day === 1 && !tutorialFlags.completed;

  // ==========================================
  // Render: Prologue & Identity
  // ==========================================
  if (gameState.phase === '序幕') {
    const ritualPrelude = [
      '你翻開潮濕的航行紀錄，紙纖維像傷口一樣裂開。',
      '每一頁都記著同一件事：有人在夜裡聽見海底的祈禱。',
      '最後一頁只剩一句話：「請選擇詛咒最初誕生的那一夜。」'
    ];
    return (
      <div className="h-screen bg-[radial-gradient(circle_at_top,#1a1410_0%,#090705_55%,#050403_100%)] text-[#d4c4a8] flex flex-col items-center p-8 font-serif overflow-y-auto">
        <div className="w-full max-w-4xl">
          <div className="border-y border-[#6e5734]/40 py-6 mb-8 text-center relative">
