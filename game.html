            <Anchor className="w-12 h-12 text-[#8b6e4e] mx-auto mb-3 opacity-80" />
            <h1 className="text-4xl md:text-5xl text-[#d4af37] font-bold tracking-[0.18em] drop-shadow-lg">《聖瑪利亞號的遺骸》</h1>
            <p className="text-[#8b795e] text-sm mt-3 tracking-widest uppercase">航海日誌 · 詛咒回溯儀式</p>
          </div>

          <div className="bg-[#16120e]/90 border border-[#4b3a27] rounded-xl p-6 mb-8 shadow-2xl">
            <h2 className="text-[#d4af37] text-lg font-bold mb-4 flex items-center"><ScrollText className="w-5 h-5 mr-2" /> 序章</h2>
            <div className="space-y-3 text-[#b9ab95] leading-relaxed">
              {ritualPrelude.map((line, idx) => (
                <p key={`prelude-static-${idx}`} className="opacity-95">{line}</p>
              ))}
            </div>
          </div>

          <div className="bg-[#14100d]/95 border border-[#4b3a27] rounded-xl p-6 shadow-xl mb-6">
            <h3 className="text-[#d4af37] text-lg font-bold mb-5">選擇詛咒起源</h3>
            <div className="relative ml-2">
              <div className="absolute left-3 top-0 bottom-0 w-px bg-[#6e5734]/60"></div>
              <div className="space-y-4">
                {PROLOGUE_VARIANTS.map((variant, idx) => (
                  <button
                    key={variant.id}
                    onClick={() => { tryAutoStart(); rollIdentity(variant.id); }}
                    className="w-full text-left pl-10 pr-4 py-4 bg-[#1a1510] border border-[#3a2e22] rounded-lg hover:border-[#d4af37]/70 hover:bg-[#211a13] transition group relative"
                  >
                    <span className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-[#2a2218] border border-[#8b6e4e] flex items-center justify-center text-[#d4af37] text-xs font-bold">{idx + 1}</span>
                    <div className="text-[#d4af37] font-bold text-lg mb-1">{variant.title}</div>
                    <div className="text-[#a49682] text-sm leading-relaxed">{variant.text}</div>
                    <div className="text-[#8b795e] text-xs italic mt-2">紀錄附註：{variant.hook}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="border border-red-900/50 bg-red-950/20 rounded-xl p-4 text-center">
            <p className="text-red-200 text-sm mb-3">如果你拒絕閱讀，就讓命運替你擲骰。</p>
            <button
              onClick={() => {
                tryAutoStart();
                const randomPrologue = PROLOGUE_VARIANTS[Math.floor(Math.random() * PROLOGUE_VARIANTS.length)];
                rollIdentity(randomPrologue.id);
              }}
              className="px-6 py-3 bg-[#2a0e0e] border border-red-800 text-red-200 hover:bg-[#3a1111] hover:text-red-100 rounded-lg transition font-bold"
            >
              跳過敘事，直接擲骰命運
            </button>
          </div>

          <p className="text-center text-[#7b6d59] mt-6 text-xs">
            你不是在選擇關卡，你是在選擇哪一段罪行，先被記住。
          </p>
        </div>
      </div>
    );
  }

  if (gameState.phase === '身分揭曉') {
    const identityStory = NPC_BACKGROUND_STORIES[gameState.playerCard?.id];
    return (
      <div className="h-screen bg-[#060504] text-[#d4c4a8] flex flex-col items-center justify-center p-10 font-serif overflow-y-auto">
        <div className="max-w-2xl w-full flex flex-col items-center">
          <h2 className="text-2xl text-[#8b6e4e] mb-6 tracking-widest uppercase">身分確認</h2>
          <div className="bg-[#16120e] border-2 border-[#d4af37] p-10 rounded-xl shadow-[0_0_40px_rgba(212,175,55,0.15)] w-full text-center relative overflow-hidden">
            <User className="w-20 h-20 text-[#d4af37] mx-auto mb-6 opacity-80" />
            <h1 className="text-5xl font-bold text-[#d4c4a8] mb-2">{gameState.playerCard.name}</h1>
            <p className="text-xl text-[#8b795e] mb-8">{gameState.playerCard.job} | 隱藏性格：{gameState.playerCard.persona}</p>
            <div className="bg-[#0d0a08] border border-[#3a2e22] p-6 rounded text-left">
              <h3 className="text-[#d46a5a] font-bold text-lg mb-3 flex items-center"><ShieldAlert className="w-5 h-5 mr-2" /> 專屬扮演法則</h3>
              <p className="text-[#a49682] leading-relaxed text-base">{gameState.playerCard.rule}</p>
            </div>
            <div className="bg-[#0d0a08] border border-[#3a2e22] p-6 rounded text-left mt-5">
              <h3 className="text-[#d4af37] font-bold text-lg mb-3 flex items-center"><BookOpen className="w-5 h-5 mr-2" /> 角色獨白</h3>
              <p className="text-[#a49682] leading-relaxed text-base whitespace-pre-wrap">
                {identityStory?.background || `你是 ${gameState.playerCard.name}。在這艘船上，你的每一個選擇都可能改寫命運。`}
              </p>
            </div>
          </div>
          <button onClick={acceptIdentity} className="mt-10 px-8 py-4 bg-[#2a2218] border border-[#d4af37] text-[#d4af37] hover:bg-[#d4af37] hover:text-[#060504] transition duration-300 text-lg font-bold rounded flex items-center">
            <Eye className="w-5 h-5 mr-2" /> 接受命運，調整能力
          </button>
        </div>
      </div>
    );
  }

  if (gameState.phase === '屬性分配') {
    const player = gameState.playerCard;
    const base = gameState.basePlayerAttributes || {};
    const allocated = gameState.allocatedAttributes || {};
    const free = gameState.freeAttributePoints || 0;
    const attrNames = {
      INSIGHT: '洞察', WILLPOWER: '意志', CHARISMA: '魅力', VIGOR: '體魄'
    };

    const handleAllocate = (attr, delta) => {
      const current = allocated[attr] || 0;
      const newVal = current + delta;
      if (newVal < 0 || newVal > 4) return;
      const totalAllocated = Object.values(allocated).reduce((a, b) => a + b, 0) + delta;
      if (totalAllocated > 4) return;
      if (((base[attr] || 0) + newVal) > 8) return;
      setGameState(prev => ({
        ...prev,
        allocatedAttributes: { ...prev.allocatedAttributes, [attr]: newVal },
        freeAttributePoints: 4 - totalAllocated
      }));
    };

    return (
      <div className="h-screen bg-[#060504] text-[#d4c4a8] flex flex-col items-center justify-center p-10 font-serif overflow-y-auto">
        <div className="max-w-2xl w-full">
          <h2 className="text-2xl text-[#d4af37] mb-4 text-center">調整你的能力</h2>

          <div className="bg-[#16120e] border border-[#d4af37] p-6 rounded-xl mb-8">
            <div className="flex items-center gap-4 mb-4">
              <User className="w-10 h-10 text-[#d4af37]" />
              <div>
                <h3 className="text-xl font-bold">{player?.name}</h3>
                <p className="text-sm text-[#8b795e]">{player?.job} · 法則：{player?.persona}</p>
              </div>
            </div>
            <p className="text-sm italic text-[#a49682] bg-[#0d0a08] p-3 rounded border-l-4 border-[#d4af37]">
              「{player?.rule}」
            </p>
          </div>

          <div className="bg-[#16120e] border-2 border-[#3a2e22] p-6 rounded-xl">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold text-[#d4af37]">基礎屬性（由法則決定）</h3>
              <span className="bg-[#d4af37] text-[#0a0806] px-3 py-1 rounded-full text-sm font-bold">
                剩餘自由點：{free}
              </span>
            </div>

            <div className="space-y-4">
              {Object.entries(base).map(([key, value]) => {
                const added = allocated[key] || 0;
                const total = value + added;
                return (
                  <div key={key} className="bg-[#0d0a08] p-4 rounded border border-[#2a2218]">
                    <div className="flex justify-between items-center mb-2">
                      <div>
                        <span className="text-[#d4c4a8] font-bold">{attrNames[key]}</span>
                        <span className="text-xs text-[#8b795e] ml-2">基礎 {value}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => handleAllocate(key, -1)}
                          disabled={added <= 0}
                          className="w-8 h-8 rounded bg-[#2a2218] text-[#d4af37] disabled:opacity-30 disabled:cursor-not-allowed"
                        >-</button>
                        <span className="text-xl font-bold w-8 text-center">{total}</span>
                        <button
                          onClick={() => handleAllocate(key, 1)}
                          disabled={free <= 0 || total >= 8}
                          className="w-8 h-8 rounded bg-[#2a2218] text-[#d4af37] disabled:opacity-30 disabled:cursor-not-allowed"
                        >+</button>
                      </div>
                    </div>
                    <div className="w-full bg-[#1a1510] h-2 rounded overflow-hidden">
                      <div className="h-full bg-[#d4af37]" style={{ width: `${(total / 8) * 100}%` }} />
                    </div>
                  </div>
                );
              })}
            </div>

            <button
              onClick={finalizeAttributes}
              disabled={free !== 0}
              className="w-full mt-8 py-3 bg-[#d4af37] text-[#0a0806] font-bold rounded disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[#fcd34d] transition"
            >
              {free === 0 ? '確認屬性，進入深淵' : `請分配完剩餘 ${free} 點`}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (gameState.phase === '開場文本') {
    // 沉浸式開場文本
    const openingLines = [
      "你睜開眼睛。",
      "船艙在搖晃，但海面明明沒有風。",
      "你聽見隔壁房間傳來指甲刮擦木板的聲音，持續了整整一夜。",
      "今天早上，你看見每個人的眼睛裡都映著同一片沒有星辰的黑暗。",
      "你知道，有什麼東西已經上船了。"
    ];

    return (
      <div className="h-screen bg-black text-[#d4c4a8] flex flex-col items-center justify-center p-10 font-serif overflow-hidden relative">
        <div className="max-w-2xl w-full h-full flex flex-col items-center justify-center">
          <div className="text-3xl leading-relaxed text-center space-y-6 min-h-[200px] flex flex-col justify-center">
            {openingLines.map((line, idx) => (
              <p key={`opening-${idx}`} className="opacity-95">{line}</p>
            ))}
          </div>
          <div className="mt-12 text-sm text-[#8b795e] animate-pulse">
            正在進入深淵…
          </div>
        </div>
      </div>
    );
  }

  // ==========================================
  // Render: Main Layout (3-Pane)
  // ==========================================
  return (
    <div className="flex h-screen bg-[#0a0806] text-[#d4c4a8] font-sans overflow-hidden">
      <IconDefs />   {/* 👈 全站深淵微光濾鏡 */}
      {/* Transient action panel (shows important observation/action results) */}
      {actionPanel && (
        <div className="fixed left-1/2 transform -translate-x-1/2 top-6 z-50">
          <div className="px-4 py-2 rounded-lg shadow-lg bg-[#0d0a08]/95 border border-[#3a2e22] text-sm text-[#d4c4a8] font-medium max-w-xl">
            {actionPanel.msg}
          </div>
        </div>
      )}
      
      {/* 1. 常駐側欄 (Persistent Sidebar) - 260px */}
      <aside className="w-[260px] bg-[#120f0c] border-r border-[#3a2e22] flex flex-col shadow-2xl z-30 shrink-0">
        {/* Title */}
        <div className="p-5 border-b border-[#3a2e22] bg-[#16120e]">
          <h1 className="text-lg text-[#d4af37] font-bold tracking-wider font-serif flex items-center mb-1"><Anchor className="w-5 h-5 mr-2 opacity-80" /> 聖瑪利亞號</h1>
          <p className="text-xs text-[#8b795e]">Day {gameState.day} · {gameState.phase}</p>
        </div>
        
        {/* Player Card */}
        <div className="p-5 border-b border-[#3a2e22]">
          <div className="bg-[#1a1510] border border-[#4a3b2c] p-3 rounded-lg shadow-inner">
            <div className="flex items-center mb-2">
              <User className="w-4 h-4 text-[#8b6e4e] mr-2" />
              <span className="font-bold text-sm text-[#d4c4a8]">{gameState.playerCard.name}</span>
            </div>
            <p className="text-xs text-[#8b795e]">{gameState.playerCard.job} · {gameState.playerCard.persona}</p>
          </div>
        </div>

        {/* AP Compass */}
        <div className="p-5 flex justify-center border-b border-[#3a2e22]">
          <div className="relative w-24 h-24 flex items-center justify-center rounded-full border-4 border-[#2a2218] bg-[#0d0a08] shadow-inner">
            <Compass className="absolute w-full h-full opacity-10 text-[#8b6e4e]" />
            <div className="text-center z-10">
              <div className="text-2xl font-bold text-[#6a9fb5]">{gameState.ap}</div>
              <div className="text-[10px] text-[#8b795e] uppercase font-bold tracking-widest">AP</div>
            </div>
            {/* Visual AP Ring (Simulated) */}
            <svg className="absolute w-full h-full transform -rotate-90">
               <circle cx="44" cy="44" r="42" fill="none" stroke="#1f1912" strokeWidth="4" />
               <circle cx="44" cy="44" r="42" fill="none" stroke="#6a9fb5" strokeWidth="4" strokeDasharray="264" strokeDashoffset={264 - (264 * (gameState.ap/9))} className="transition-all duration-500" />
            </svg>
          </div>
        </div>
        <div className="p-3 text-center border-b border-[#3a2e22]">
          <div className="text-[10px] text-[#8b795e] uppercase mb-1 font-bold">深淵侵蝕度</div>
          <div className="w-full bg-[#0d0a08] h-3 rounded overflow-hidden border border-[#2a2218]">
            <div className="h-full bg-gradient-to-r from-[#2b6cb0] to-[#8b2e22] transition-all" style={{ width: `${Math.min(100, gameState.abyssLevel)}%` }}></div>
          </div>
          <div className="text-xs text-[#8b795e] mt-1">{gameState.abyssLevel}/100</div>
        </div>

        {/* Navigation */}
        <nav className="flex-1 p-3 space-y-2">
          <button onClick={() => {setView('EXPLORE'); openRoom(null);}} className={`w-full flex items-center p-3 rounded-lg text-sm font-bold transition-all ${view==='EXPLORE' && !activeRoom ? 'bg-[#2a2218] text-[#d4af37] border border-[#d4af37]/50 shadow-md' : 'text-[#8b795e] hover:bg-[#1a1510] hover:text-[#d4c4a8]'}`}><MapIcon className="w-4 h-4 mr-3"/> 全艦地圖</button>
          <button onClick={() => setView('BOARD')} className={`w-full flex items-center p-3 rounded-lg text-sm font-bold transition-all ${view==='BOARD' ? 'bg-[#2a2218] text-[#d4af37] border border-[#d4af37]/50 shadow-md' : 'text-[#8b795e] hover:bg-[#1a1510] hover:text-[#d4c4a8]'}`}><BrainCircuit className="w-4 h-4 mr-3"/> 約束圖譜</button>
          <button onClick={() => setView('GUIDE')} className={`w-full flex items-center p-3 rounded-lg text-sm font-bold transition-all ${view==='GUIDE' ? 'bg-[#2a2218] text-[#d4af37] border border-[#d4af37]/50 shadow-md' : 'text-[#8b795e] hover:bg-[#1a1510] hover:text-[#d4c4a8]'}`}><HelpCircle className="w-4 h-4 mr-3"/> 航海指南</button>
        </nav>

        {/* Actions */}
        <div className="p-4 border-t border-[#3a2e22] space-y-3">
          {gameState.phase === '白天' && (
            <button onClick={() => setGameState(p => ({ ...p, phase: '黃昏' }))} className="w-full bg-[#1f1912] hover:bg-[#2a2218] text-[#8b795e] border border-[#4a3b2c] p-3 rounded-lg transition text-sm font-bold shadow-lg flex justify-center items-center">
              結束白天 <SkipForward className="w-4 h-4 ml-2"/>
            </button>
          )}
          {gameState.phase === '黃昏' && (
            <button onClick={() => openTrialModal()} className="w-full bg-[#3a1512] hover:bg-[#4a1a15] text-[#e8b4b0] p-3 rounded-lg transition text-sm font-bold shadow-lg border border-[#8b2e22] flex justify-center items-center">
              進入審判 <Crosshair className="w-4 h-4 ml-2"/>
            </button>
          )}
          {gameState.phase === '夜晚' && (
            <button onClick={handleNightTransition} className="w-full bg-[#101820] hover:bg-[#162230] text-[#6a9fb5] p-3 rounded-lg transition text-sm font-bold shadow-lg border border-[#2a4a5a] flex justify-center items-center">
               <FastForward className="w-4 h-4 mr-2"/> 結算夜晚
            </button>
          )}
          {gameState.isGameOver && (
             <button onClick={restartGame} className="w-full bg-[#1f1912] text-[#8b795e] border border-[#3a2e22] p-3 rounded-lg flex justify-center items-center text-sm"><RefreshCw className="w-4 h-4 mr-2"/> 重新啟航</button>
          )}
          {/* 聲音控制按鈕 */}
          <button 
            onClick={togglePlay} 
            className="w-full flex items-center p-3 rounded-lg text-sm font-bold transition-all text-[#8b795e] hover:bg-[#1a1510] hover:text-[#d4c4a8]"
          >
            {isPlaying ? '🔊 深海靜默' : '🔈 聆聽深淵'}
          </button>
        </div>
      </aside>

      {/* 2. 主視圖區域 (Main View Area) - Flex Grow */}
      <main className="flex-1 relative bg-[#060504] overflow-hidden flex flex-col z-10" ref={mapRef} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/old-map.png')] opacity-30 pointer-events-none z-0"></div>
        {!tutorialFlags.completed && (
          <div className="absolute top-4 right-4 z-[70]">
            <button onClick={() => setShowTutorialHelp(s => !s)} className="w-9 h-9 rounded-full border border-[#d4af37]/70 bg-[#16120e]/95 text-[#d4af37] font-bold shadow-lg hover:bg-[#2a2218] transition">?</button>
            {showTutorialHelp && (
              <div className="mt-2 w-72 bg-[#16120e]/95 border border-[#4a3b2c] rounded-lg p-3 text-xs text-[#d4c4a8] shadow-2xl">
                <p className="text-[#d4af37] font-bold mb-2">新手航海指引</p>
                <p className="mb-2">清晨先進入命案房間，再搜查、質問，黃昏進入審判。</p>
                <button onClick={disableTutorial} className="text-[#d4af37] hover:text-[#fcd34d] underline">我已知曉這片海域（關閉引導）</button>
              </div>
            )}
          </div>
        )}
        
        {/* View: EXPLORE -> Map */}
        {view === 'EXPLORE' && !activeRoom && (
          <div className="w-full h-full relative z-10 animate-in fade-in duration-300" style={{ cursor: isDragging ? 'grabbing' : 'grab' }}>
            <div className="absolute right-6 bottom-6 flex flex-col gap-2 z-50">
              <button onMouseDown={(e)=>e.stopPropagation()} onClick={() => setScale(s => Math.min(s + 0.2, 2))} className="bg-[#1f1912]/90 border border-[#d4af37]/50 text-[#d4af37] p-3 rounded-lg hover:bg-[#2a2218] shadow-lg backdrop-blur-sm"><ZoomIn className="w-5 h-5"/></button>
              <button onMouseDown={(e)=>e.stopPropagation()} onClick={() => setScale(s => Math.max(s - 0.2, 0.4))} className="bg-[#1f1912]/90 border border-[#d4af37]/50 text-[#d4af37] p-3 rounded-lg hover:bg-[#2a2218] shadow-lg backdrop-blur-sm"><ZoomOut className="w-5 h-5"/></button>
              <button onMouseDown={(e)=>e.stopPropagation()} onClick={() => { setPan({x:0, y:0}); setScale(0.85); }} className="bg-[#1f1912]/90 border border-[#d4af37]/50 text-[#d4af37] p-3 rounded-lg hover:bg-[#2a2218] shadow-lg backdrop-blur-sm mt-2"><Maximize className="w-5 h-5"/></button>
            </div>

            <div className="absolute origin-center transition-transform duration-75 ease-out w-full h-full flex items-center justify-center" style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})` }}>
              <div className="w-[800px] h-[1000px] min-w-[800px] min-h-[1000px] shrink-0 relative pointer-events-none">
                {/* Simplified SVG Map */}
                <svg viewBox="0 0 800 1000" className="absolute inset-0 w-full h-full opacity-60 drop-shadow-2xl">
                    <path d="M 400 50 C 480 150 650 350 650 800 C 650 950 480 950 400 950 C 320 950 150 950 150 800 C 150 350 320 150 400 50 Z" fill="#0d0a08" stroke="#8b6e4e" strokeWidth="4" strokeDasharray="10 5" />
                    <line x1="400" y1="50" x2="400" y2="950" stroke="#8b6e4e" strokeWidth="2" strokeDasharray="5 5" opacity="0.5"/>
                </svg>

                {LOCATIONS.map(loc => {
                  const charsHere = gameState.characters.filter(c => c.location === loc.id && c.alive);
                  const deadHere = gameState.truths.filter(t => t.day === gameState.day && t.location === loc.id);
                  const isPlayerHere = charsHere.some(c => c.id === gameState.playerCard?.id);
                  const isSafe = charsHere.length > 0 && deadHere.length === 0;

                  // 動態光環顏色判定
                  let ringColor = 'border-[#4a3b2c]';
                  let bgGlow = '';
                  if (isPlayerHere) { ringColor = 'border-blue-500'; bgGlow = 'shadow-[0_0_20px_rgba(59,130,246,0.6)]'; }
                  else if (deadHere.length > 0) { ringColor = 'border-yellow-500'; bgGlow = 'shadow-[0_0_25px_rgba(234,179,8,0.5)] animate-pulse'; }
                  else if (isSafe) { ringColor = 'border-green-800'; bgGlow = 'shadow-[0_0_15px_rgba(22,101,52,0.5)]'; }

                  return (
                    <button key={loc.id} onMouseDown={(e)=>e.stopPropagation()} onClick={() => { openRoom(loc.id); setView('EXPLORE'); if (tutorialActive && !tutorialFlags.firstMove) markTutorial('firstMove'); }} className="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group pointer-events-auto" style={{ left: loc.cx, top: loc.cy }}>
                      <div className="relative transition-transform duration-300 group-hover:scale-110">
                        <div className={`w-16 h-16 bg-[#1f1912] border-2 ${ringColor} rounded-full flex items-center justify-center z-10 relative ${bgGlow}`}>
                          <LocationSvgIcon icon={loc.icon} className="w-8 h-8 text-[#d4af37]" />
                        </div>
                        {deadHere.length > 0 && <div className="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md z-20"><Skull className="w-4 h-4"/></div>}
                        {charsHere.length > 0 && <div className="absolute -bottom-1 -right-1 bg-blue-900 text-white text-xs font-bold px-2 py-0.5 rounded-full border border-black z-20">{charsHere.length}</div>}
                      </div>
                      <span className="mt-2 text-sm font-bold text-[#d4c4a8] bg-[#0d0a08]/90 px-3 py-1 rounded-md border border-[#3a2e22] backdrop-blur-sm group-hover:text-[#d4af37] shadow-lg">{loc.name}</span>
                    </button>
                  );
                })}
                {tutorialActive && !tutorialFlags.firstMove && tutorialTargetLoc && (
                  <div className="absolute inset-0 pointer-events-none z-40">
                    <div
                      className="absolute bg-black/70 text-[#d4af37] p-4 rounded-lg border border-[#d4af37] shadow-lg max-w-xs text-center backdrop-blur-sm animate-pulse pointer-events-auto"
                      style={{ left: tutorialTargetLoc.cx - 120, top: tutorialTargetLoc.cy - 150 }}
                    >
                      <p className="text-sm italic">「命案現場…那裡或許有線索。」</p>
                      <div className="text-lg mt-1 animate-bounce">▼</div>
                      <button onClick={disableTutorial} className="mt-2 text-[10px] underline text-[#d4c4a8] hover:text-[#fcd34d]">不再顯示</button>
                    </div>
                    <div
                      className="absolute w-24 h-24 rounded-full border-4 border-yellow-500/50 animate-ping"
                      style={{ left: tutorialTargetLoc.cx - 48, top: tutorialTargetLoc.cy - 48 }}
                    />
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {/* View: EXPLORE -> Room */}
        {view === 'EXPLORE' && activeRoom && (
          <div className="w-full h-full flex flex-col z-20 bg-[#060504] animate-in slide-in-from-right-4 duration-300 relative">
            {/* Quick Switcher & Header */}
            <div className="bg-[#120f0c]/95 border-b border-[#3a2e22] shrink-0 z-30 shadow-lg p-4 backdrop-blur-md">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center">
                  <button onClick={() => openRoom(null)} className="mr-4 p-2 bg-[#1a1510] hover:bg-[#2a2218] rounded border border-[#3a2e22] text-[#8b795e] transition"><ArrowLeft className="w-5 h-5" /></button>
                  <h2 className="text-3xl font-bold text-[#d4af37] font-serif tracking-wide flex items-center"><span className="w-10 h-10 mr-3 inline-flex items-center justify-center"><LocationSvgIcon icon={LOCATIONS.find(l=>l.id===activeRoom).icon} className="w-9 h-9 text-[#d4af37]" /></span> {LOCATIONS.find(l=>l.id===activeRoom).name}</h2>
                </div>
                {/* Quick Nav Dropdown (click to toggle; click outside to close) */}
                <div className="relative" ref={quickNavRef}>
                  <button onClick={() => setQuickNavOpen(v => !v)} className="flex items-center bg-[#1a1510] border border-[#3a2e22] px-4 py-2 rounded text-sm text-[#8b795e] hover:text-[#d4c4a8]"><MapIcon className="w-4 h-4 mr-2"/> 快速移動 <ChevronDown className="w-4 h-4 ml-2"/></button>
                  <div className={`absolute right-0 mt-2 w-48 bg-[#16120e] border border-[#3a2e22] rounded shadow-2xl z-50 ${quickNavOpen ? 'block' : 'hidden'}`}>
                    {LOCATIONS.filter(l=>l.id !== activeRoom).map(l => (
                      <button key={`nav-${l.id}`} onClick={() => { openRoom(l.id); setQuickNavOpen(false); if (tutorialActive && !tutorialFlags.firstMove) markTutorial('firstMove'); }} className="w-full text-left px-4 py-2 text-sm text-[#8b795e] hover:bg-[#2a2218] hover:text-[#d4af37] border-b border-[#2a2218] last:border-0 flex items-center gap-2"><LocationSvgIcon icon={l.icon} className="w-4 h-4 shrink-0" /> <span>{l.name}</span></button>
                    ))}
                  </div>
                </div>
              </div>
              
              {/* Search Spots */}
              {gameState.phase === '白天' && (
                <div className="relative flex flex-wrap gap-3">
                  {tutorialActive && !tutorialFlags.firstSearch && (
                    <div className="absolute -top-10 left-1/2 -translate-x-1/2 z-50 text-center">
                      <div className="bg-[#d4af37] text-[#0a0806] text-xs px-3 py-1 rounded-full whitespace-nowrap animate-bounce">點擊搜查，消耗 1 AP</div>
                      <button onClick={disableTutorial} className="mt-1 text-[10px] text-[#d4af37] underline">不再顯示</button>
                    </div>
                  )}
                  {LOCATIONS.find(l=>l.id===activeRoom).spots.map(spot => {
                    const isSearched = gameState.searchedSpots[`${activeRoom}_${spot.id}`];
                    return (
                      <button key={`spot-${spot.id}`} onClick={() => handleInvestigateSpot(spot)} disabled={isSearched} className={`px-4 py-2 rounded border shadow-md transition-all flex items-center text-sm font-bold ${isSearched ? 'bg-[#0d0a08] border-[#2a2218] text-[#5a4e3e]' : 'bg-[#1a1510] border-[#4a3b2c] text-[#d4c4a8] hover:border-[#d4af37] hover:shadow-[0_0_10px_rgba(212,175,55,0.2)] hover:-translate-y-0.5'}`}>
                        {isSearched ? <CheckCircle2 className="w-4 h-4 mr-2 opacity-50" /> : <Search className="w-4 h-4 mr-2 text-[#d4af37]" />}
                        {spot.name} {!isSearched && <span className="ml-2 text-blue-400 text-xs">-1 AP</span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {tutorialActive && tutorialFlags.firstInterrogate && !tutorialFlags.firstBelief && (
              <div className="absolute right-6 top-24 z-40 bg-[#0d0a08]/95 border border-[#d4af37]/70 text-[#d4c4a8] px-4 py-3 rounded-lg shadow-xl max-w-xs">
                <p className="text-xs italic">船員耳語：「也試著問他的『看法』，你會知道他懷疑誰。」</p>
                <button onClick={disableTutorial} className="mt-2 text-[10px] text-[#d4af37] hover:text-[#fcd34d] underline">我已知曉這片海域</button>
              </div>
            )}

            {/* Room Content (NPCs & Corpses) */}
            <div className="flex-1 overflow-y-auto p-6 bg-[url('https://www.transparenttextures.com/patterns/black-linen.png')] custom-scrollbar">
              <div className="max-w-5xl mx-auto space-y-6 pb-20">
                {/* Dead Bodies */}
                {gameState.truths.filter(t => t.day === gameState.day && t.location === activeRoom).map((truth, idx) => {
                  // 找到現存的角色物件（可能為 alive=false 的屍體）與兇手物件，用於動態生成描述
                  const victimObj = gameState.characters.find(c => c.name === truth.victim) || null;
                  const killerObj = gameState.characters.find(c => c.name === truth.killer) || null;
                  const roomObj = LOCATIONS.find(l => l.id === truth.location) || null;
                  const sceneText = truth.isCopycat
                    ? generateCopycatScene(truth.grimoire, killerObj, victimObj, gameState)
                    : generateDynamicScene(truth.grimoire, victimObj, killerObj, roomObj, gameState);
                  return (
                    <div key={`dead-${idx}`} className="p-5 bg-[#2a0a08]/90 border border-red-900/50 rounded-xl shadow-xl flex items-start relative overflow-hidden">
                      <div className="absolute top-0 right-0 bg-red-900/80 text-red-200 text-xs px-3 py-1 font-bold rounded-bl-lg">現場觀測</div>
                      <Skull className="w-10 h-10 text-red-500 mr-4 mt-1 shrink-0" />
                      <div>
                        <h3 className="text-xl font-bold text-red-400 mb-2 uppercase">{truth.victim} 的屍體</h3>
                        <p className="text-sm text-[#d4c4a8] leading-relaxed bg-[#1a0504] p-3 rounded border border-red-900/30 font-serif"><strong className="text-[#d4af37]">特徵：</strong>{sceneText}</p>
                      </div>
                    </div>
                  )
                })}

                {/* Living NPCs */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  {gameState.characters.filter(c => c.location === activeRoom && c.alive).map(char => {
                    const isPlayer = char.id === gameState.playerCard?.id;
                    const suspectName = gameState.characters.find(c => c.id === char.suspectedId)?.name || '無';
                    const infectionDots = '●'.repeat(Math.min(char.infection, 5)) + '○'.repeat(Math.max(0, 5 - char.infection));
                    const isStressed = char.stress > 70;

                    return (
                      <div key={char.id} className={`p-5 rounded-xl border ${isPlayer ? 'border-blue-800 bg-[#0a1520]' : 'border-[#3a2e22] bg-[#1a1510]'} shadow-lg flex flex-col relative`}>
                        {isPlayer && <div className="absolute -top-3 -right-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg border-2 border-[#0a1520] animate-bounce">這是你</div>}
                        {!isPlayer && tutorialActive && !tutorialFlags.firstInterrogate && (
                          <div className="absolute -right-2 -top-2 bg-blue-600 text-white text-[10px] px-2 py-1 rounded-full z-20 animate-pulse">
                            質問他
                          </div>
                        )}
                        
                        <div className="flex justify-between items-start mb-4">
                          <div>
                            <h3 className={`text-xl font-bold mb-1 ${isPlayer ? 'text-blue-300' : 'text-[#d4c4a8]'}`}>{char.name}</h3>
                            <span className="text-xs text-[#8b795e] bg-[#0d0a08] px-2 py-1 rounded border border-[#2a2218]">{char.job} | {char.persona}</span>
                          </div>
                          {isStressed && <ShieldAlert className="w-6 h-6 text-red-500 animate-pulse" title="精神崩潰" />}
                        </div>

                        {/* Agentic Info - 資訊分層 */}
                        {!isPlayer && (
                          <div className="mb-4 space-y-1 text-xs bg-[#0d0a08] p-3 rounded border border-[#2a2218]">
                            {/* 懷疑對象 - 需提問才能揭露 */}
                            <div className="flex justify-between">
                              <span className="text-[#8b795e]"><Eye className="inline w-3 h-3 mr-1"/> 懷疑對象：</span>
                              <span className={`font-bold ${gameState.playerKnowledge?.[`suspect_${char.id}`] ? 'text-[#d4af37]' : 'text-[#5a4e3e] italic'}`}>
                                {gameState.playerKnowledge?.[`suspect_${char.id}`] ? 
                                  (gameState.characters.find(c => c.id === char.suspectedId)?.name || '無') :
                                  '？？？ (需詢問)'}
                              </span>
                            </div>
                            
                            {/* 感染深度 - 隱藏 */}
                            <div className="flex justify-between">
                              <span className="text-[#8b795e]"><Sparkles className="inline w-3 h-3 mr-1"/> 感染深度：</span>
                              <span className="text-purple-400 tracking-widest font-bold">
                                {gameState.playerKnowledge?.[`secret_${char.id}`] ?
                                  ('●'.repeat(Math.min(char.infection, 5)) + '○'.repeat(Math.max(0, 5 - char.infection))) :
                                  '? ? ? (未知)'}
                              </span>
                            </div>
                          </div>
                        )}

                        <div className="mt-auto">
                          <div className="flex justify-between text-xs text-[#8b795e] mb-1 font-bold"><span>壓力值</span><span>{char.stress}/100</span></div>
                          <div className={`h-2 rounded-full bg-[#0d0a08] border border-[#2a2218] overflow-hidden mb-4 ${isStressed ? 'animate-[shake_0.5s_infinite]' : ''}`}>
                            <div className={`h-full transition-all duration-500 ${isStressed ? 'bg-red-500' : char.stress > 40 ? 'bg-yellow-500' : 'bg-blue-500'}`} style={{width: `${char.stress}%`}}></div>
                          </div>

                          {!isPlayer && (
                            <div className="flex flex-col gap-2">
                              {gameState.phase === '白天' && (
                                <>
                                  <button onClick={() => handleInterrogate(char, 'alibi')} className="w-full bg-[#2a2218] hover:bg-[#3a2e22] text-[#6a9fb5] text-sm py-2 rounded border border-[#4a3b2c] transition font-bold shadow-sm flex justify-center items-center"><MessageCircle className="w-4 h-4 mr-1"/> 質問 (-1)</button>
                                  <button onClick={() => handleInterrogate(char, 'belief')} className="w-full bg-[#2a2218] hover:bg-[#3a2e22] text-[#d4af37] text-sm py-2 rounded border border-[#4a3b2c] transition font-bold shadow-sm flex justify-center items-center"><User className="w-4 h-4 mr-1"/> 看法 (-1)</button>
                                  <button 
                                    onClick={() => {
                                      if (gameState.ap <= 0) { alert("AP 不足！"); return; }
                                      const playerInsight = gameState.playerAttributes?.[PLAYER_ATTRIBUTES.INSIGHT] || 3;
                                      const check = performSearchCheck(playerInsight, 30); // 高難度
                                      triggerDiceAnimation(check, `暗中觀察：${char.name}`);
                                      if (check.success) {
                                        setGameState(prev => ({
                                          ...prev,
                                          ap: prev.ap - 1,
                                          playerKnowledge: { ...prev.playerKnowledge, [`secret_${char.id}`]: true }
                                        }));
                                        addLog(`【暗中觀察】成功洞察 ${char.name} 的秘密…感染深度已揭露。[${check.message}]`, 'success');
                                      } else {
                                        setGameState(prev => {
                                          let chars = [...prev.characters];
                                          const idx = chars.findIndex(c => c.id === char.id);
                                          chars[idx].stress = Math.min(100, chars[idx].stress + 15);
                                          return { ...prev, ap: prev.ap - 1, characters: chars };
                                        });
                                        addLog(`【暗中觀察】${char.name} 警覺到你的探視…[${check.message}]`, 'alert');
                                      }
                                    }}
                                    disabled={gameState.playerKnowledge?.[`secret_${char.id}`] || gameState.ap <= 0}
                                    className="w-full bg-[#2a2218] hover:bg-[#3a2e22] disabled:bg-[#1a1510] disabled:text-[#5a4e3e] text-[#8b795e] text-sm py-2 rounded border border-[#4a3b2c] transition font-bold shadow-sm flex justify-center items-center"><EyeOff className="w-4 h-4 mr-1"/> 觀察 (-1)</button>
                                      <button onClick={() => handleBond(char)} disabled={gameState.bonds?.[char.id]?.bonded || gameState.ap < 3} className="w-full bg-[#2a2218] hover:bg-[#3a2e22] disabled:bg-[#1a1510] disabled:text-[#5a4e3e] text-[#d4c4a8] text-sm py-2 rounded border border-[#4a3b2c] transition font-bold shadow-sm flex justify-center items-center"><Sparkles className="w-4 h-4 mr-1"/> 深入交談 (-3)</button>
                                </>
                              )}
                              {gameState.phase === '黃昏' && (
                                <button onClick={() => handleVote(char)} className="w-full bg-[#4a1512] hover:bg-[#5a1a15] text-[#e8b4b0] text-sm py-2 rounded border border-red-900/50 transition font-bold flex justify-center items-center"><Crosshair className="w-4 h-4 mr-2"/> 處決</button>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    )
                  })}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* View: BOARD (Constraint Graph) */}
        {view === 'BOARD' && (
          <div className="w-full h-full p-8 bg-[#0a0806] overflow-y-auto custom-scrollbar relative z-20">
            <div className="max-w-4xl mx-auto">
              <h2 className="text-3xl font-bold text-[#d4af37] font-serif mb-2 flex items-center"><BrainCircuit className="w-8 h-8 mr-3"/> 約束求解圖譜</h2>
                <p className="text-[#8b795e] mb-8 text-sm">將收集到的線索填入圖譜，驗證邏輯方程是否閉合。</p>

                <div className="flex flex-col md:flex-row gap-6 items-center justify-center mb-10">
                  {/* Node A */}
                  <div className="bg-[#16120e] border-2 border-red-900/50 p-5 rounded-xl w-64 shadow-lg relative">
                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-900 text-red-200 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">觀測節點</div>
                    <Skull className="w-8 h-8 text-red-500 mx-auto mb-3" />
                    <div 
                      onDrop={(e) => handleDrop(e, 'victim')} 
                      onDragOver={(e) => e.preventDefault()} 
                      onClick={() => setBoardVictim('')}
                      className={`w-full mt-2 h-10 border-2 border-dashed flex items-center justify-center rounded text-sm transition-colors cursor-pointer ${boardVictim ? 'border-red-500 bg-red-900/30 text-red-200' : 'border-[#3a2e22] text-[#5a4e3e] hover:border-red-900/50'}`}
                    >
                      {boardVictim ? `[死者] ${boardVictim}` : "拖曳死者檔案至此"}
                    </div>
                  </div>

                  <ArrowLeft className="w-8 h-8 text-[#8b6e4e] md:transform md:-rotate-180 rotate-90 shrink-0" />

                  {/* Node B */}
                  <div className="bg-[#16120e] border-2 border-yellow-700/50 p-5 rounded-xl w-64 shadow-lg relative">
                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-yellow-700 text-yellow-100 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">絕對法則</div>
                    <BookOpen className="w-8 h-8 text-yellow-500 mx-auto mb-3" />
                    <div 
                      onDrop={(e) => handleDrop(e, 'grimoire')} 
                      onDragOver={(e) => e.preventDefault()} 
                      onClick={() => setBoardGrimoire('')}
                      className={`w-full mt-2 h-10 border-2 border-dashed flex items-center justify-center rounded text-sm transition-colors cursor-pointer ${boardGrimoire ? 'border-yellow-500 bg-yellow-900/30 text-yellow-200' : 'border-[#3a2e22] text-[#5a4e3e] hover:border-yellow-900/50'}`}
                    >
                      {boardGrimoire ? `[法則] ${GRIMOIRES[boardGrimoire]?.name}` : "拖曳古籍法則至此"}
                    </div>
                  </div>

                  <ArrowLeft className="w-8 h-8 text-[#8b6e4e] md:transform md:-rotate-180 rotate-90 shrink-0" />

                  {/* Node C */}
                  <div className="bg-[#16120e] border-2 border-blue-900/50 p-5 rounded-xl w-64 shadow-lg relative">
                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-900 text-blue-200 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">溯源節點</div>
                    <User className="w-8 h-8 text-blue-500 mx-auto mb-3" />
                    <div 
                      onDrop={(e) => handleDrop(e, 'suspect')} 
                      onDragOver={(e) => e.preventDefault()} 
                      onClick={() => setBoardSuspect('')}
                      className={`w-full mt-2 h-10 border-2 border-dashed flex items-center justify-center rounded text-sm transition-colors cursor-pointer ${boardSuspect ? 'border-blue-500 bg-blue-900/30 text-blue-200' : 'border-[#3a2e22] text-[#5a4e3e] hover:border-blue-900/50'}`}
                    >
                      {boardSuspect ? `[嫌疑人] ${boardSuspect}` : "拖曳嫌疑人至此"}
                    </div>
                  </div>
                </div>

                <div className="flex justify-center mb-8">
                  <button onClick={runConstraintAnalysis} className="bg-[#d4af37] hover:bg-[#fcd34d] text-[#0a0806] px-8 py-3 rounded-lg transition text-lg font-bold shadow-[0_0_15px_rgba(212,175,55,0.4)] flex items-center">
                    <Activity className="w-5 h-5 mr-2" /> 執行約束檢定
                  </button>
                </div>

                {solverResult && (
                  <div className="bg-[#16120e] border border-[#3a2e22] p-6 rounded-xl shadow-xl animate-in fade-in slide-in-from-bottom-4">
                    <h4 className="text-xs uppercase text-[#8b795e] mb-4 tracking-widest font-bold">Solver Log // 檢定日誌</h4>
                    {solverResult.checks && (
                      <div className="space-y-3 mb-6">
                        <div className="bg-[#0d0a08] p-4 rounded border border-[#2a2218] flex justify-between items-center">
                          <div>
                            <p className="text-sm text-[#d4c4a8] font-bold">邊緣 A: {solverResult.checks.edge1.label}</p>
                            <p className="text-xs text-[#8b795e] mt-1">↳ {solverResult.checks.edge1.desc}</p>
                          </div>
                          <span className={`px-3 py-1 rounded text-xs font-bold ${solverResult.checks.edge1.passed ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}`}>{solverResult.checks.edge1.passed ? 'PASSED' : 'FAILED'}</span>
                        </div>
                        <div className="bg-[#0d0a08] p-4 rounded border border-[#2a2218] flex justify-between items-center">
                          <div>
                            <p className="text-sm text-[#d4c4a8] font-bold">邊緣 B: {solverResult.checks.edge2.label}</p>
                            <p className="text-xs text-[#8b795e] mt-1">↳ {solverResult.checks.edge2.desc}</p>
                          </div>
                          <span className={`px-3 py-1 rounded text-xs font-bold ${solverResult.checks.edge2.passed ? 'bg-green-900/50 text-green-400' : 'bg-yellow-900/50 text-yellow-400'}`}>{solverResult.checks.edge2.passed ? 'PASSED' : 'UNVERIFIED'}</span>
                        </div>
                      </div>
                    )}
                    <div className={`p-4 rounded-lg text-lg font-bold text-center ${solverResult.status === 'success' ? 'bg-green-900/30 border border-green-800 text-green-400' : 'bg-red-900/30 border border-red-800 text-red-400'}`}>
                      {solverResult.finalMsg}
                    </div>
                  </div>
                )}

                {/* Draggable Roster Palette */}
                <div className="mt-12 border-t border-[#3a2e22] pt-8 animate-in fade-in">
                  <h3 className="text-[#d4af37] font-bold mb-4 flex items-center"><User className="w-5 h-5 mr-2"/> 人物與案宗名冊 <span className="text-[#8b795e] text-xs ml-3 font-normal">(拖曳標籤至上方對應節點，點擊節點可清空)</span></h3>
                  <div className="flex flex-col md:flex-row gap-8">
                    <div className="flex-1 bg-[#120f0c] p-4 rounded-xl border border-[#2a2218]">
                      <h4 className="text-xs uppercase text-[#8b795e] mb-3 font-bold">已知死者 (拖曳至觀測節點)</h4>
                      <div className="flex flex-wrap gap-2">
                        {gameState.truths.map(t => (
                          <div key={`drag-v-${t.id}`} draggable onDragStart={(e) => handleDragStart(e, 'victim', t.victim)} className="bg-red-950/40 border border-red-900/50 text-red-300 px-3 py-1.5 rounded cursor-grab active:cursor-grabbing text-sm hover:bg-red-900/60 transition shadow-sm">
                            <Skull className="w-3 h-3 inline mr-1 opacity-70"/> {t.victim}
                          </div>
                        ))}
                        {gameState.truths.length === 0 && <span className="text-[#5a4e3e] text-sm italic">尚無死者</span>}
                      </div>
                    </div>
                    <div className="flex-[2] bg-[#120f0c] p-4 rounded-xl border border-[#2a2218]">
                      <h4 className="text-xs uppercase text-[#8b795e] mb-3 font-bold">嫌疑人名冊 (拖曳至溯源節點)</h4>
                      <div className="flex flex-wrap gap-2">
                        {INITIAL_CHARACTERS.map(c => {
                          const isDead = !gameState.characters.find(char => char.id === c.id)?.alive;
                          return (
                            <div key={`drag-s-${c.id}`} draggable={!isDead} onDragStart={(e) => !isDead && handleDragStart(e, 'suspect', c.name)} className={`px-3 py-1.5 rounded text-sm border shadow-sm transition ${isDead ? 'bg-[#1a1510] border-[#3a2e22] text-[#5a4e3e] line-through cursor-not-allowed' : 'bg-blue-950/30 border-blue-900/50 text-blue-300 hover:bg-blue-900/50 cursor-grab active:cursor-grabbing'}`}>
                              {c.name}
                            </div>
                          )
                        })}
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* View: GUIDE */}
          {view === 'GUIDE' && (
             <div className="w-full h-full p-8 bg-[#0a0806] overflow-y-auto custom-scrollbar z-20">
               <div className="max-w-3xl mx-auto">
                 <h2 className="text-3xl font-bold text-[#d4af37] font-serif mb-6 flex items-center"><HelpCircle className="w-8 h-8 mr-3"/> 航海指南</h2>
                 <div className="space-y-6 text-base text-[#a49682] leading-relaxed">
                    <div className="bg-[#16120e] p-6 rounded-xl border border-[#3a2e22]">
                      <h3 className="text-[#d4af37] font-bold mb-3 text-lg">1. 遊戲目標</h3>
                      <p>每天夜晚，深淵怪物會附身在某人身上並殺死另一名船員。你的目標是利用 8 點 AP 搜查房間、質問 NPC，透過「約束圖譜」找出真凶，並在黃昏將其處決。但要小心，處決無辜者會引發恐慌，導致連續殺人（雙殺）。</p>
                    </div>
                    <div className="bg-[#16120e] p-6 rounded-xl border border-[#3a2e22]">
                      <h3 className="text-[#d4af37] font-bold mb-3 text-lg">2. 雙殺容錯機制</h3>
                      <p>第一次處決錯誤時，有 50% 機率觸發雙殺，全體壓力上升 15 點。若連續兩次處決錯誤，深淵將徹底暴走，必定觸發雙殺。</p>
                    </div>
                    <div className="bg-[#16120e] p-6 rounded-xl border border-[#3a2e22]">
                      <h3 className="text-[#d4af37] font-bold mb-3 text-lg">3. 真凶與模仿犯 (Copycat)</h3>
                      <p>怪物（真凶）的手法會完美契合「絕對法則」且被附身者會表現出異常症狀。但極度高壓且傲慢/冷酷的 NPC，可能會為了私怨成為「模仿犯」。模仿犯的現場會有破綻（例如淡水偽裝海水），圖譜驗證時會提示這是一場拙劣的模仿。</p>
                    </div>
                 </div>
               </div>
             </div>
          )}

          {/* Special Event Dialog Overlay */}
          {activeSpecialEvent && (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-2xl bg-[#16120e] border-2 border-red-800 rounded-xl shadow-2xl">
                <div className="bg-red-950/80 p-4 border-b border-red-800 flex items-center justify-between">
                  <h2 className="text-2xl font-bold text-red-400 flex items-center"><AlertTriangle className="w-6 h-6 mr-2" /> 重大危機：{activeSpecialEvent.name}</h2>
                  <div className="text-sm text-red-200 font-bold">倒數：{specialEventTimer}s</div>
                </div>
                <div className="p-6">
                  <p className="text-lg text-[#d4c4a8] leading-relaxed mb-6">{activeSpecialEvent.desc}</p>
                  <div className="space-y-3">
                    {activeSpecialEvent.choices && activeSpecialEvent.choices.map((choice, idx) => (
                      <button
                        key={idx}
                        onClick={() => resolveSpecialEvent(choice)}
                        className="w-full text-left p-4 bg-[#1a1510] border border-[#3a2e22] rounded-lg hover:border-[#d4af37] hover:bg-[#2a2218] transition"
                      >
                        <p className="font-bold text-[#d4af37]">{choice.text}</p>
                        <p className="text-xs text-[#8b795e] mt-1">檢定屬性：{choice.attribute} (難度 {choice.difficulty})</p>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Central Dialog Overlay */}
          {activeDialog && (gameState.phase === '白天' || activeDialog.isDiscovery || activeDialog.isObstacle) && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
              <div className="w-full max-w-2xl bg-[#16120e] border-2 border-[#d4af37] rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.8)] flex flex-col overflow-hidden">
                {/* Discovery Popup */}
                {activeDialog.isDiscovery && (
                  <>
                    <div className="bg-gradient-to-r from-[#8b6e4e] to-[#d4af37] p-4 flex justify-between items-center relative">
                      <h2 className="text-[#0a0806] font-bold text-lg flex items-center">🔍 {activeDialog.name}</h2>
                      <button onClick={() => setActiveDialog(null)} className="text-[#0a0806] hover:text-[#2a2218] p-1"><X className="w-6 h-6"/></button>
                    </div>
                    <div className="p-8 min-h-[200px] bg-[#1a1510] border-t-2 border-[#d4af37]">
                      <div className="text-lg text-[#d4c4a8] leading-relaxed font-serif italic">
                        {activeDialog.text.split(/\n\s*\n/).map((para, idx) => (
                          <p key={idx} className="mb-3">{parseHighlightedText(para)}</p>
                        ))}
                      </div>
                    </div>
                    <div className="bg-[#0d0a08] p-4 flex justify-end">
                      <button onClick={() => setActiveDialog(null)} className="bg-[#d4af37] text-[#0a0806] px-6 py-2 rounded font-bold hover:bg-[#fcd34d] transition">
                        確認
                      </button>
                    </div>
                  </>
                )}
                
                {/* Obstacle Dialog */}
                {activeDialog.isObstacle && (
                  <>
                    <div className="bg-[#8b4513] text-[#ffd700] p-4 flex justify-between items-center">
                      <h2 className="font-bold text-lg flex items-center">⚠️ {activeDialog.name}</h2>
                      <button onClick={() => setActiveDialog(null)} className="text-[#ffd700] hover:text-white p-1"><X className="w-6 h-6"/></button>
                    </div>
                    <div className="p-6 bg-[#1a1510]">
                      <div className="text-lg text-[#d4c4a8] mb-4">
                        {activeDialog.text.split(/\n\s*\n/).map((para, idx) => (
                          <p key={idx} className="mb-3">{parseHighlightedText(para)}</p>
                        ))}
                      </div>
                      <div className="bg-[#0d0a08] p-3 rounded border border-[#3a2e22] text-sm text-[#8b795e]">
                        {activeDialog.obstacleText}
                      </div>
                    </div>
                    <div className="bg-[#0d0a08] p-4 flex justify-end gap-3">
                      <button onClick={() => setActiveDialog(null)} className="bg-[#3a2e22] text-[#d4c4a8] px-6 py-2 rounded font-bold hover:bg-[#4a3b2c] transition">
                        返回
                      </button>
                    </div>
                  </>
                )}
                {/* Personal Quest Dialog */}
                {activeDialog.isPersonalQuest && (
                  <>
                    <div className="bg-[#6b4b1a] text-[#fff8e6] p-4 flex justify-between items-center">
                      <h2 className="font-bold text-lg">📜 {activeDialog.name}</h2>
                      <button onClick={() => setActiveDialog(null)} className="text-[#fff8e6] hover:text-white p-1"><X className="w-6 h-6"/></button>
                    </div>
                    <div className="p-6 bg-[#1a1510]">
                      <div className="text-lg text-[#d4c4a8] mb-4">
                        {activeDialog.text.split(/\n\s*\n/).map((para, idx) => (
                          <p key={idx} className="mb-3">{parseHighlightedText(para)}</p>
                        ))}
                      </div>
                      <p className="text-sm text-[#8b795e]">接受將花費 1 AP 並可能觸發額外支線。拒絕則將影響 NPC 好感。</p>
                    </div>
                    <div className="bg-[#0d0a08] p-4 flex justify-end gap-3">
                      <button onClick={() => { setActiveDialog(null); }} className="bg-[#3a2e22] text-[#d4c4a8] px-6 py-2 rounded font-bold hover:bg-[#4a3b2c] transition">暫不處理</button>
                      <button onClick={() => {
                        // 接受任務：記錄在 gameState.personalQuests（包含接受時間）
                        setGameState(prev => ({ ...prev, ap: Math.max(0, prev.ap - 1), personalQuests: [...(prev.personalQuests||[]), { ...activeDialog.quest, accepted: true, acceptedAt: prev.day }], activePersonalQuest: null }));
                        addLog(`【個人任務】你接受了 ${activeDialog.quest.npcName} 的請求。`, 'success');
                        setActiveDialog(null);
                      }} className="bg-[#d4af37] text-[#0a0806] px-6 py-2 rounded font-bold hover:bg-[#fcd34d] transition">接受任務</button>
                    </div>
                  </>
                )}
                
                {/* Regular Interrogation Dialog */}
                {!activeDialog.isDiscovery && !activeDialog.isObstacle && (
                  <>
                    <div className="bg-[#1a1510] border-b border-[#3a2e22] p-4 flex justify-between items-center relative">
                      <div className="flex items-center">
                        <User className="w-6 h-6 text-[#d4af37] mr-3"/>
                        <span className="text-[#d4af37] font-bold text-xl">{activeDialog.name} 的證詞</span>
                      </div>
                      <button onClick={() => setActiveDialog(null)} className="text-[#8b795e] hover:text-[#d4c4a8] p-1"><X className="w-6 h-6"/></button>
                    </div>
                    
                    {/* Skill Check Display */}
                    {activeDialog.skillCheck && (
                      <div className="bg-[#0d0a08] border-b border-[#3a2e22] p-4 grid grid-cols-4 gap-2 text-xs">
                        <div className="text-center">
                          <div className="text-[#8b795e]">擲骰</div>
                          <div className={`text-lg font-bold ${activeDialog.skillCheck.success ? 'text-green-400' : 'text-red-400'}`}>{activeDialog.skillCheck.roll}</div>
                        </div>
                        <div className="text-center">
                          <div className="text-[#8b795e]">目標值</div>
                          <div className="text-lg font-bold text-[#d4af37]">{activeDialog.skillCheck.target}</div>
                        </div>
                        <div className="text-center">
                          <div className="text-[#8b795e]">結果</div>
                          <div className={`font-bold ${activeDialog.skillCheck.message.includes('成功') ? 'text-green-400' : 'text-red-400'}`}>{activeDialog.skillCheck.message}</div>
                        </div>
                        <div className="text-center">
                          <div className="text-[#8b795e]">誤差</div>
                          <div className={`text-lg font-bold ${activeDialog.skillCheck.success ? 'text-blue-400' : 'text-orange-400'}`}>±{activeDialog.skillCheck.margin}</div>
                        </div>
                      </div>
                    )}
                    
                    <div className="p-8 min-h-[150px]">
                      <div className="text-xl text-[#d4c4a8] leading-relaxed font-serif">
                        {activeDialog.text.split(/\n\s*\n/).map((para, idx) => (
                          <p key={idx} className="mb-3">「{parseHighlightedText(para)}」</p>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {diceAnim && (
            <div className="absolute top-5 left-1/2 -translate-x-1/2 z-[75] pointer-events-none">
              <div className="min-w-[320px] bg-[#0d0a08]/95 border border-[#4a3b2c] rounded-xl shadow-2xl px-5 py-4 backdrop-blur-sm">
                <div className="text-[10px] uppercase tracking-widest text-[#8b795e] mb-2">判定中 · {diceAnim.label}</div>
                {diceAnim.phase === 'rolling' ? (
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 border-4 border-[#d4af37] border-t-transparent rounded-lg animate-spin"></div>
                    <div className="text-base text-[#d4c4a8]">擲骰中……深海在凝視這次結果</div>
                  </div>
                ) : (
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-xs text-[#8b795e]">擲骰 / 目標</div>
                      <div className={`text-3xl font-extrabold ${diceAnim.success ? 'text-green-400' : 'text-red-400'}`}>
                        {diceAnim.roll} <span className="text-[#8b795e] text-base">/ {diceAnim.target}</span>
                      </div>
                    </div>
                    <div className={`text-sm font-bold px-3 py-1 rounded border ${diceAnim.isCritical ? 'text-yellow-300 border-yellow-600 bg-yellow-900/20' : diceAnim.isFumble ? 'text-red-300 border-red-700 bg-red-900/20' : diceAnim.success ? 'text-green-300 border-green-700 bg-green-900/20' : 'text-red-300 border-red-700 bg-red-900/20'}`}>
                      {diceAnim.message}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Game Over Ending Panel */}
          {gameState.isGameOver && (
            <div className="absolute inset-0 bg-black/90 z-50 flex items-center justify-center p-8">
              <div className="max-w-2xl bg-[#16120e] border-2 border-[#d4af37] p-10 rounded-xl text-center animate-in fade-in duration-500">
                <h2 className="text-3xl font-bold text-[#d4af37] mb-6">━━━━ 航程終結 ━━━━</h2>
                <p className="text-lg text-[#d4c4a8] leading-relaxed mb-8 font-serif">{generateEpilogue(gameState)}</p>
                <div className="flex gap-4 justify-center">
                  <button onClick={restartGame} className="bg-[#d4af37] text-[#0a0806] px-8 py-3 rounded-lg font-bold hover:bg-[#fcd34d] transition">
                    重新啟航 ⛵
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Trial Modal Overlay */}
          {trialOpen && (
            <div className="absolute inset-0 bg-black/80 z-60 flex items-center justify-center p-6">
              <div className="w-full max-w-4xl bg-[#0f0d0b] border-2 border-[#d4af37] rounded-xl shadow-2xl p-6">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-2xl font-bold text-[#d4af37]">⚖️ 審判面板 — 黃昏</h3>
                  <div className="flex items-center gap-2">
                    <button onClick={() => { setTrialOpen(false); }} className="px-3 py-1 rounded bg-[#2a2218] text-[#d4c4a8]">關閉</button>
                    <button onClick={() => { setTrialOpen(false); setGameState(prev => ({ ...prev, phase: '黃昏' })); }} className="px-3 py-1 rounded bg-[#1f1912] text-[#8b795e]">回到黃昏</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="col-span-2 bg-[#14110f] p-4 rounded border border-[#2a2218]">
                    <div className="flex justify-between items-center mb-3">
                      <div className="text-sm text-[#8b795e]">登記投票順序與 NPC 投票動畫</div>
                      <div className="text-sm text-[#8b795e]">可先使用政治行動影響傾向 / 預覽票數</div>
                    </div>

                    <div className="space-y-2 max-h-64 overflow-y-auto pr-2">
                      {gameState.characters.filter(c => c.alive).map((c, idx) => {
                        const isPlayer = c.id === gameState.playerCard?.id;
                        return (
                          <div key={`trial-row-${c.id}`} className="flex items-center justify-between p-2 bg-[#0d0a08] rounded border border-[#1f1912]">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 bg-[#1a1510] rounded-full flex items-center justify-center text-sm font-bold text-[#d4c4a8]">{c.name[0]}</div>
                              <div>
                                <div className="font-bold text-sm text-[#d4c4a8]">{c.name} {isPlayer && <span className="text-xs text-blue-300">(玩家)</span>}</div>
                                <div className="text-xs text-[#8b795e]">{c.job} · {c.persona}</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-xs text-[#8b795e]">票：<span className="font-bold text-[#d4af37]">{trialPreviewVotes && trialPreviewVotes[c.id] ? trialPreviewVotes[c.id] : 0}</span></div>
                              <div className="w-28 text-right">
                                {!isPlayer ? (
                                  <div className={`px-3 py-1 rounded ${trialAnimating ? 'bg-[#2a2218] text-[#8b795e]' : 'bg-[#16120e] text-[#d4c4a8]'}`}>等待揭示</div>
                                ) : (
                                  <select value={trialPlayerSelection || ''} onChange={(e) => setTrialPlayerSelection(e.target.value)} className="bg-[#0d0a08] border border-[#2a2218] text-sm text-[#d4c4a8] px-2 py-1 rounded">
                                    <option value="">-- 你的投票 --</option>
                                    {gameState.characters.filter(x => x.alive && x.id !== c.id).map(opt => (<option key={opt.id} value={opt.id}>{opt.name}</option>))}
                                    <option value="abstain">棄票</option>
                                  </select>
                                )}
                              </div>
                            </div>
                          </div>
                        )
                      })}
                    </div>

                    <div className="mt-4 flex items-center gap-3">
                      <button onClick={() => startTrialReveal()} disabled={trialAnimating} className="px-4 py-2 bg-[#d4af37] text-[#0a0806] rounded font-bold">揭示 NPC 投票</button>
                      <button onClick={() => finalizeTrial(trialPlayerSelection || 'abstain')} className="px-4 py-2 bg-[#4a1512] text-[#e8b4b0] rounded font-bold">最終投票並結算</button>
                      <div className="text-sm text-[#8b795e]">選擇後點擊「最終投票並結算」完成審判。</div>
                    </div>
                  </div>

                  <div className="bg-[#14110f] p-4 rounded border border-[#2a2218]">
                    <h4 className="text-sm font-bold text-[#d4af37] mb-3">政治行動面板</h4>
                    <div className="space-y-2">
                      <div className="flex gap-2 mb-2">
                        <select value={politicalTarget} onChange={(e) => setPoliticalTarget(e.target.value)} className="flex-1 bg-[#0d0a08] border border-[#2a2218] text-sm text-[#d4c4a8] px-2 py-1 rounded">
                          <option value="">-- 選擇拉票目標 NPC --</option>
                          {gameState.characters.filter(ch => ch.alive).map(ch => (<option key={`pt-${ch.id}`} value={ch.id}>{ch.name}</option>))}
                        </select>
                        <select value={politicalAlly} onChange={(e) => setPoliticalAlly(e.target.value)} className="flex-1 bg-[#0d0a08] border border-[#2a2218] text-sm text-[#d4c4a8] px-2 py-1 rounded">
                          <option value="">-- 選擇招攬盟友 NPC --</option>
                          {gameState.characters.filter(ch => ch.alive).map(ch => (<option key={`pa-${ch.id}`} value={ch.id}>{ch.name}</option>))}
                        </select>
                      </div>
                      <button onClick={() => {
                        const vid = politicalTarget;
                        if (!vid) { alert('請先從上方選擇拉票目標'); return; }
                        const target = gameState.characters.find(ch => ch.id === vid);
                        const candidate = gameState.characters.find(ch => ch.id === trialPlayerSelection);
                        if (!target) { alert('找不到 NPC'); return; }
                        if (!candidate) { alert('請先選擇候選人作為拉票目標'); return; }
                        performLobby(target.id, candidate.id);
                        setPoliticalTarget('');
                        openTrialModal();
                      }} className="w-full bg-[#1f1912] text-[#d4af37] px-3 py-2 rounded">拉票 (-2 AP)</button>

                      <button onClick={() => {
                        const candidate = gameState.characters.find(ch => ch.id === trialPlayerSelection);
                        if (!candidate) { alert('請先選擇目標'); return; }
                        performSlander(candidate.id);
                        openTrialModal();
                      }} className="w-full bg-[#1f1912] text-[#e06a5a] px-3 py-2 rounded">抹黑 (-3 AP)</button>

                      <button onClick={() => {
                        const allyId = politicalAlly;
                        if (!allyId) { alert('請先從上方選擇要招攬的 NPC'); return; }
                        const ally = gameState.characters.find(ch => ch.id === allyId);
                        const candidate = gameState.characters.find(ch => ch.id === trialPlayerSelection);
                        if (!ally || !candidate) { alert('找不到 NPC 或未選擇候選人'); return; }
                        performAlliance(ally.id, candidate.id);
                        setPoliticalAlly('');
                        openTrialModal();
                      }} className="w-full bg-[#1f1912] text-[#6a9fb5] px-3 py-2 rounded">結盟 (-4 AP)</button>

                      <button onClick={() => { performSelfDefend(); openTrialModal(); }} className="w-full bg-[#1f1912] text-[#8b795e] px-3 py-2 rounded">自辯 (-2 AP)</button>
                    </div>

                    <div className="mt-4 bg-[#0d0a08] p-3 rounded border border-[#1f1912] text-sm text-[#8b795e]">
                      <div className="font-bold text-xs text-[#d4af37] mb-2">票數預覽</div>
                      {Object.keys(trialPreviewVotes || {}).length === 0 ? <div className="text-xs italic text-[#5a4e3e]">尚無預覽</div> : (
                        <div className="space-y-1">
                          {Object.entries(trialPreviewVotes).map(([k,v]) => (
                            <div key={`pv-${k}`} className="flex justify-between"><div className="text-sm text-[#d4c4a8]">{k === 'abstain' ? '棄票' : (gameState.characters.find(ch=>ch.id===k)?.name || k)}</div><div className="font-bold text-[#d4af37]">{v}</div></div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {tutorialActive && gameState.phase === '黃昏' && !tutorialFlags.firstTrial && (
            <div className="absolute inset-0 bg-black/70 z-[65] flex items-center justify-center p-6">
              <div className="bg-[#16120e] border-2 border-[#d4af37] p-8 rounded-xl max-w-md text-center shadow-2xl">
                <h3 className="text-2xl text-[#d4af37] mb-4">審判時刻</h3>
                <p className="text-[#d4c4a8] mb-6 leading-relaxed">
                  現在你可以投票處決一名嫌疑人。<br/>
                  但記住：若處決無辜，恐懼將蔓延，<br/>
                  深淵可能附身第二個人……
                </p>
                <button onClick={() => markTutorial('firstTrial')} className="bg-[#d4af37] text-[#0a0806] px-6 py-2 rounded font-bold hover:bg-[#fcd34d] transition">
                  我明白了
                </button>
              </div>
            </div>
          )}
      </main>

      {/* 3. 動態資訊面板 (Dynamic Info Panel) - 360px */}
      <aside className="w-[360px] bg-[#120f0c] border-l border-[#3a2e22] flex flex-col shrink-0 z-30 shadow-[-4px_0_15px_rgba(0,0,0,0.5)]">
        {/* Tabs */}
        <div className="flex border-b border-[#3a2e22] bg-[#0d0a08]">
          <button onClick={() => setRightTab('LOGS')} className={`flex-1 py-4 text-sm font-bold transition flex justify-center items-center ${rightTab==='LOGS' ? 'bg-[#1a1510] text-[#d4af37] border-b-2 border-[#d4af37]' : 'text-[#8b795e] hover:bg-[#16120e]'}`}><ScrollText className="w-4 h-4 mr-2"/> 航行日誌</button>
          <button onClick={() => setRightTab('INVENTORY')} className={`flex-1 py-4 text-sm font-bold transition flex justify-center items-center relative ${rightTab==='INVENTORY' ? 'bg-[#1a1510] text-[#d4af37] border-b-2 border-[#d4af37]' : 'text-[#8b795e] hover:bg-[#16120e]'}`}>
            <Backpack className="w-4 h-4 mr-2"/> 線索背包
            {gameState.inventory.grimoires.length + gameState.inventory.npcJournals.length > 0 && <span className="absolute top-2 right-4 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>}
          </button>
        </div>

        {/* Content: LOGS */}
        {rightTab === 'LOGS' && (
          <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-[#16120e]">
            <div className="flex justify-end mb-3">
              <button onClick={() => setLogFilter(f => f==='ALL' ? 'IMPORTANT' : 'ALL')} className="flex items-center text-xs text-[#8b795e] hover:text-[#d4c4a8] bg-[#0d0a08] px-2 py-1 rounded border border-[#2a2218]">
                <Filter className="w-3 h-3 mr-1"/> {logFilter === 'ALL' ? '過濾重要' : '顯示全部'}
              </button>
            </div>
            <div className="space-y-3">
              {filteredLogs.map((log) => {
                if (log.type === 'bark') {
                  return (
                    <div key={log.id} className={`text-sm italic leading-relaxed p-3 rounded-r-lg border-l-4 border-t border-r border-b border-[#2a2218] bg-[#0d0a08] shadow-sm border-l-amber-700/40`}>
                      <div className="opacity-50 text-[10px] mb-1 font-mono">DAY {log.day} | {log.phase}</div>
                      <div className="text-amber-200">💬 {log.msg}</div>
                    </div>
                  )
                }
                let borderColor = 'border-l-[#3a2e22]';
                if (log.type === 'death') borderColor = 'border-l-red-600 bg-red-950/20';
                else if (log.type === 'fatal') borderColor = 'border-l-red-500 bg-red-900/40 text-red-100 font-bold';
                else if (log.type === 'success') borderColor = 'border-l-green-500 bg-green-950/20';
                else if (log.type === 'alert') borderColor = 'border-l-yellow-500 bg-yellow-950/20';
                else if (log.type === 'tutorial') borderColor = 'border-l-[#d4af37] bg-[#2a2218]/60';

                return (
                  <div key={log.id} className={`text-sm leading-relaxed p-3 rounded-r-lg border-l-4 border-t border-r border-b border-[#2a2218] bg-[#1a1510] shadow-sm ${borderColor}`}>
                    <div className="opacity-50 text-[10px] mb-1 font-mono">DAY {log.day} | {log.phase}</div>
                    <div className="text-[#d4c4a8]">{log.msg}</div>
                  </div>
                )
              })}
              <div ref={logsEndRef} />
            </div>
          </div>
        )}

        {/* Content: INVENTORY */}
        {rightTab === 'INVENTORY' && (
          <div className="flex-1 overflow-y-auto p-5 custom-scrollbar bg-[#16120e]">
             {/* 收集的古籍法則 */}
             <h3 className="text-xs uppercase font-bold text-[#8b795e] mb-3 tracking-widest border-b border-[#3a2e22] pb-2">古籍殘頁</h3>
             <div className="space-y-3 mb-6">
                {gameState.inventory.grimoires.length === 0 ? <p className="text-sm text-[#5a4e3e] italic bg-[#0d0a08] p-4 rounded border border-[#2a2218] text-center">空空如也</p> : 
                  CLUE_POOL.filter(c => gameState.inventory.grimoires.includes(c.id)).map(c => (
                    <div key={`inv-g-${c.id}`} draggable onDragStart={(e) => handleDragStart(e, 'grimoire', c.grimoire)} className="text-sm bg-[#1a1510] p-4 rounded-lg border border-[#4a3b2c] flex flex-col shadow-md cursor-grab active:cursor-grabbing hover:border-yellow-700/50 transition-colors group">
                      <span className="text-[#d4af37] text-xs font-bold mb-2 flex justify-between items-center">
                        <span>【法則特徵】</span>
                        <span className="text-[#8b795e] text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">可拖曳</span>
                      </span>
                      <span className="text-[#d4c4a8] leading-relaxed">{c.text}</span>
                    </div>
                  ))
                }
             </div>

             {/* NPC 日記殘頁 */}
             <h3 className="text-xs uppercase font-bold text-[#8b795e] mb-3 tracking-widest border-b border-[#3a2e22] pb-2">死者日記</h3>
             <div className="space-y-3">
                {gameState.inventory.npcJournals.length === 0 ? <p className="text-sm text-[#5a4e3e] italic bg-[#0d0a08] p-4 rounded border border-[#2a2218] text-center">空空如也</p> : 
                  gameState.inventory.npcJournals.map(journal => (
                    <div key={journal.id} draggable onDragStart={(e) => handleDragStart(e, 'victim', journal.author)} className="text-sm bg-[#2a1a1a]/50 p-4 rounded-lg border border-red-900/30 flex flex-col shadow-md cursor-grab active:cursor-grabbing hover:border-red-700/50 transition-colors group">
                      <span className="text-red-400 text-xs font-bold mb-2 pb-1 border-b border-red-900/30 flex justify-between items-center">
                        <span>[{journal.author} 的絕筆]</span>
                        <span className="text-red-900 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">可拖曳</span>
                      </span>
                      <span className="text-[#a49682] italic leading-relaxed">「{journal.text}」</span>
                    </div>
                  ))
                }
             </div>
          </div>
        )}
      </aside>

      <style dangerouslySetInnerHTML={{__html: `
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0d0a08; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a2e22; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #5a4e3e; }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-2px); }
          50% { transform: translateX(2px); }
          75% { transform: translateX(-2px); }
        }
      `}} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SantaMaria />);
</script>
</body>
</html>
